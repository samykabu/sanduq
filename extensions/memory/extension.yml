schema_version: '1.0'
extension:
  id: memory
  name: Sanduq Memory
  version: "2.2.1"
  description: Reconcile verified feature specifications into current project memory,
    migrate required fixtures, and archive through scoped recoverable Git commits.
  author: Samy K. Abushanab
  license: PolyForm-Noncommercial-1.0.0
  repository: https://github.com/samykabu/sanduq
  homepage: https://github.com/samykabu/sanduq/tree/main/extensions/memory
  category: process
requires:
  speckit_version: '>=1.0.0,<2.0.0'
  tools:
  - name: python
    required: true
    version: '>=3.11'
  - name: git
    required: true
provides:
  commands:
  - name: speckit.memory.init
    file: commands/init.md
    description: 'Configures Sanduq Memory for a Spec Kit project (merge branch, verification checks, host wrappers, lifecycle hooks and script guards) without enabling automatic archiving. Use when asked to "set up project memory" or "initialize memory".'
  - name: speckit.memory.prepare
    file: commands/prepare.md
    description: 'Queues an implemented feature for archival after merge without deleting it; also the after_implement hook. Use when the Execute handoff returns speckit.memory.prepare or when asked to "queue this feature for archival".'
  - name: speckit.memory.run
    file: commands/run.md
    description: 'Archives selected verified feature folders into project memory through a checkpoint, a reviewed delta candidate and a scoped final commit. Use when asked to "archive the feature" or "run the memory archive", or when the session handoff returns speckit.memory.run.'
  - name: speckit.memory.session
    file: commands/session.md
    description: 'Processes pending merged archives at the start of a local session and resumes an interrupted run; also the before_specify hook. Use when the session handoff returns speckit.memory.session or when asked to "process pending archives".'
  - name: speckit.memory.enable
    file: commands/enable.md
    description: 'Reviews the concrete archive policy with the owner and records approval of its hash so pending archives run automatically. Use when asked to "enable automatic archiving" or "review the memory policy".'
  - name: speckit.memory.impact
    file: commands/impact.md
    description: 'Consults current product memory for the capabilities a change touches, within a token budget; also the before_analyze hook. Use when specifying or analyzing a feature, or when asked to "consult memory" or "check the impact on existing behavior".'
  - name: speckit.memory.status
    file: commands/status.md
    description: 'Reports policy approval, pending or blocked features, the active archive phase and the next command to run. Use when asked "what is the archive status" or "is a memory run stuck".'
hooks:
  # init also binds speckit.memory.impact to before_specify (after session): this manifest holds one
  # command per event, so scripts/install.py HOOKS is the full list of four registrations.
  after_implement:
    command: speckit.memory.prepare
    optional: false
    description: Queue archive work without deleting feature files
  before_specify:
    command: speckit.memory.session
    optional: false
    description: Process merged pending work before creating another specification
  before_analyze:
    command: speckit.memory.impact
    optional: false
    description: Consult current product knowledge for impact analysis
tags:
- archive
- memory
- workflow
