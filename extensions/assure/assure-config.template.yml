schema_version: "1.0"
# assure init sets these three. The analyze gate is the before_implement hook init makes mandatory;
# require_document_before_pr turns on the documentation gate in PR and CI.
lifecycle:
  mode: manual
  require_analyze_before_implement: false
  require_document_before_pr: false
scan:
  exclude:
    - .git
    - node_modules
    - bin
    - obj
    - dist
    - build
    - .next
    - .nuxt
    - .turbo
    - .expo
    - coverage
    - .cache
    - .venv
    - venv
    - __pycache__
    - target
    - vendor
    - Pods
    - .gradle
