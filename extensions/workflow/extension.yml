schema_version: '1.0'
extension:
  id: workflow
  name: Sanduq Workflow
  version: "1.14.0"
  description: GitHub issue decisions and resumable Scope-to-PR orchestration with
    optional model-aware delegation, QA, User Manual, and workflow evidence CI.
  author: Samy K. Abushanab
  repository: https://github.com/samykabu/sanduq
  license: PolyForm-Noncommercial-1.0.0
  category: process
requires:
  speckit_version: '>=1.0.0,<2.0.0'
  tools:
  - name: python
    version: '>=3.10'
    required: true
  - name: git
    required: true
  - name: gh
    required: true
provides:
  commands:
  - name: speckit.workflow.init
    file: commands/init.md
    description: "Sets up the Sanduq workflow in a Spec Kit project: selects QA and User Manual processes, decision reviewers, delegation, CI runners and evidence gate, then installs and checks the managed packages. Use once per project, or when asked to initialize, configure or reconfigure the workflow."
  - name: speckit.workflow.scope
    file: commands/scope.md
    description: "Scopes an explicit GitHub issue and continues the managed lifecycle into Specify, Clarify and Plan once no decision is pending. Use to start work on an issue by number or title, or when asked to scope, size or begin a feature from an issue."
  - name: speckit.workflow.clarify
    file: commands/clarify.md
    description: "Rereads the GitHub answers to clarification questions for an issue-bound feature, applies them to the spec and continues the lifecycle into planning, tasks and implementation. Use after people answered the issue's questions, or when asked to check or apply clarification answers."
  - name: speckit.workflow.continue
    file: commands/continue.md
    description: "Resumes an issue-bound feature at its earliest unfinished or stale stage from the workflow checkpoint and runs the remaining stages. Use in a new session, after an interruption or pause, or when asked to continue, resume or pick up a feature."
  - name: speckit.workflow.finalize
    file: commands/finalize.md
    description: "Verifies readiness and creates or updates the single pull request for an issue-bound feature, with inline visuals, then verifies the merge when reported. Use when asked to finish, finalize, open or update the PR, or check a merged feature."
  - name: speckit.workflow.status
    file: commands/status.md
    description: "Shows an issue-bound feature's current stage, active claim, receipts, profile, skipped stages, blockers and evidence freshness without changing anything. Use when asked where a feature is, what is blocking it, or what the workflow will do next."
  - name: speckit.workflow.doctor
    file: commands/doctor.md
    description: "Checks the workflow's dependencies, policy, installed host commands and skills, board configuration and package lock, reporting every missing or broken item. Use after installing or upgrading, when a claim fails on setup, or when asked to diagnose the workflow."
  - name: speckit.workflow.reconcile
    file: commands/reconcile.md
    description: "Installs or repairs the workflow's managed hooks and presets from policy through Spec Kit, without changing unrelated integrations. Use after editing .specify/workflow.yml, after an upgrade, or when doctor reports drifted hook or preset ownership."
  - name: speckit.workflow.verify-affected
    file: commands/verify-affected.md
    description: "Runs only the feature's affected test lanes locally, from the project's affected-lane hook, into the CI results.json format; the result is local evidence, never CI evidence. Use before pushing, or when asked to test what a change affects."
  - name: speckit.workflow.ci-report
    file: commands/ci-report.md
    description: "Summarizes the last N runs of a GitHub Actions workflow into per-job durations, wall-clock spans and fixed overhead versus test time. Use before changing CI lanes or runners, or when asked why CI is slow or how often runs are cancelled."
  - name: speckit.workflow.gate-explain
    file: commands/gate-explain.md
    description: "Explains a failing workflow evidence gate: names the stale stage and its exact recovery recipe, and for evidence-only drift can amend the receipt. Use when the gate or CI reports STALE_RECEIPT or another gate failure, or when asked how to fix it."
  - name: speckit.workflow.worker-brief
    file: commands/worker-brief.md
    description: "Generates a compact 3-5 KB brief for one task with its verbatim requirements, owned paths, turn budget, protocol rules and result template, so a worker skips the full spec set. Use before assigning a task to a worker agent."
  - name: speckit.workflow.apply-pending
    file: commands/apply-pending.md
    description: "Applies the proposed wording queued in workflow/pending-artifact-updates.md to the feature's contracts, data model or research, and names any receipts that became stale. Use at the end of Execute and of Review, or when asked to apply pending artifact updates."
tags:
- workflow
- qa
- documentation
- github
- context
- resumable
