schema_version: '1.0'
extension:
  id: workflow
  name: Sanduq Workflow
  version: "1.9.6"
  description: GitHub issue decisions and resumable Scope-to-PR orchestration with
    optional model-aware delegation, QA, User Manual, and workflow evidence CI.
  author: Samy K. Abushanab
  repository: https://github.com/samykabu/sanduq
  license: PolyForm-Noncommercial-1.0.0
  category: process
requires:
  speckit_version: '>=1.0.0,<2.0.0'
  tools:
  - name: python
    version: '>=3.10'
    required: true
  - name: git
    required: true
  - name: gh
    required: true
provides:
  commands:
  - name: speckit.workflow.init
    file: commands/init.md
    description: Select QA, User Manual, decision authority and CI evidence policy.
  - name: speckit.workflow.scope
    file: commands/scope.md
    description: Scope the explicit issue and automatically continue when decisions
      are resolved.
  - name: speckit.workflow.clarify
    file: commands/clarify.md
    description: Read GitHub answers and automatically prepare tasks and implementation.
  - name: speckit.workflow.continue
    file: commands/continue.md
    description: Resume the earliest unfinished or stale stage from its checkpoint.
  - name: speckit.workflow.finalize
    file: commands/finalize.md
    description: Verify completion and create or update one PR with inline visuals.
  - name: speckit.workflow.status
    file: commands/status.md
    description: Show current stage, active claim and evidence freshness.
  - name: speckit.workflow.doctor
    file: commands/doctor.md
    description: Check selected dependencies and available host commands.
  - name: speckit.workflow.reconcile
    file: commands/reconcile.md
    description: Install managed hooks and presets without changing unrelated integrations.
  - name: speckit.workflow.verify-affected
    file: commands/verify-affected.md
    description: Run this feature's affected lanes locally with the project's affected-lane hook, into the same results.json.
  - name: speckit.workflow.ci-report
    file: commands/ci-report.md
    description: Summarize the last N CI runs of a workflow into a leg/lane/critical-path table.
  - name: speckit.workflow.gate-explain
    file: commands/gate-explain.md
    description: Explain a gate failure's recovery recipe and, only for evidence-only drift, offer to fix it.
  - name: speckit.workflow.worker-brief
    file: commands/worker-brief.md
    description: Generate a 3-5 KB worker brief for one task from verbatim requirements, owned paths and the execution protocol.
  - name: speckit.workflow.apply-pending
    file: commands/apply-pending.md
    description: Apply workflow/pending-artifact-updates.md to the contracts/data-model/research it targets.
tags:
- workflow
- qa
- documentation
- github
- context
- resumable
