name: Sanduq workflow gates
on:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  workflow-evidence:
    runs-on: __sanduq_runs_on_linux__
    # sanduq:if self_hosted
    # A self-hosted runner never executes a fork's checkout and scripts.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # sanduq:endif
    # actions: read lets the gate re-read the CI run a Verify receipt is accepted through.
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # sanduq:if not candidate_merge
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # sanduq:endif
      # The gate's code and policy come from the base branch, which this PR cannot change.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .sanduq-base
          persist-credentials: false
      # GitHub expressions have no arithmetic, so the PR's commits are fetched here instead of through fetch-depth.
      - name: Fetch the PR's commits and its base branch for the gate's merge-base comparison
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          git fetch --no-tags --deepen="$COMMITS" origin "$(git rev-parse HEAD)"
          git fetch --no-tags --prune origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      # sanduq:if python_setup_action
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '__sanduq_python_version__'
      # sanduq:endif
      - name: Use the base branch's gate, or the released package on a first install
        shell: bash
        run: |
          set -euo pipefail
          echo /.sanduq-base/ >> "$(git rev-parse --git-path info/exclude)"
          gate=.sanduq-base/.specify/extensions/workflow
          if [ ! -f "$gate/extension.yml" ]; then
            mkdir -p .sanduq-base/.specify/extensions
            python - <<'PY'
          import io, re, urllib.request, zipfile
          text = open('.specify/extensions/workflow/extension.yml', encoding='utf-8-sig').read()
          version = re.search(r'(?m)^  version: *["\']?(\d+\.\d+\.\d+)["\']? *$', text)[1]
          url = 'https://github.com/samykabu/sanduq/releases/download/workflow-v%s/workflow.zip' % version
          with urllib.request.urlopen(url, timeout=120) as response:
              zipfile.ZipFile(io.BytesIO(response.read())).extractall('.sanduq-base/.specify/extensions')
          PY
            python "$gate/scripts/sanduq_ci.py" verify-release --installed .specify/extensions/workflow --release "$gate"
          fi
          python -m pip install -r "$gate/requirements.txt"
      - name: Verify selected processes and all changed feature evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gate=.sanduq-base/.specify/extensions/workflow/scripts/ci_gate.py
          # A base gate from before --trusted-root grades only the PR that upgrades it.
          trusted=(); grep -q -- --trusted-root "$gate" && trusted=(--trusted-root .sanduq-base)
          python "$gate" --root . "${trusted[@]}" --base-ref "$BASE_SHA" --check-index
