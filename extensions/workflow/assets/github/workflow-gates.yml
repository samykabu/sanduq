name: Sanduq workflow gates
on:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  workflow-evidence:
    runs-on: __sanduq_runs_on_linux__
    # actions: read lets the gate re-read the CI run a Verify receipt is accepted through.
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event.pull_request.commits + 1 }}
      # sanduq:if not candidate_merge
          ref: ${{ github.event.pull_request.head.sha }}
      # sanduq:endif
      - name: Fetch the PR base branch for the gate's merge-base comparison
        run: git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
      # sanduq:if python_setup_action
      - uses: actions/setup-python@v5
        with:
          python-version: '__sanduq_python_version__'
      # sanduq:endif
      - run: python -m pip install -r .specify/extensions/workflow/requirements.txt
      - name: Verify selected processes and all changed feature evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python .specify/extensions/workflow/scripts/ci_gate.py --base-ref "$BASE_SHA" --check-index
