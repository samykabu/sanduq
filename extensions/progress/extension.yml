schema_version: "1.0"

extension:
  id: progress
  name: "Sanduq Progress Report"
  version: "1.2.0"
  description: "A live, deterministic progress report for a Spec Kit feature: stages over time, workstreams, runs, blockers and decisions, collected from the host's native hooks and the feature files with no agent spent on upkeep."
  author: "Samy K. Abushanab"
  repository: "https://github.com/samykabu/sanduq"
  homepage: "https://github.com/samykabu/sanduq/tree/main/extensions/progress"
  category: "process"
  license: PolyForm-Noncommercial-1.0.0

requires:
  speckit_version: ">=1.1.1.dev0,<2.0.0"
  tools:
    - name: python
      required: true
      version: ">=3.11"

provides:
  commands:
    - name: speckit.progress.init
      file: commands/init.md
      description: "Creates the live progress report for the active Spec Kit feature, binds this session to it and can install the Claude status line. Use when tasks.md exists and reporting should start, or when asked to 'start the progress report' or 'track progress for this feature'."
    - name: speckit.progress.refresh
      file: commands/refresh.md
      description: "Forces one progress report snapshot now; the host hooks already refresh it, and a snapshot never marks the feature complete. Use when implementation ends, or when asked to 'refresh the progress report' or 'take a final progress snapshot'."
    - name: speckit.progress.status
      file: commands/status.md
      description: "Prints the one-line state of the Sanduq progress report (stage, lanes, blockers, decisions), or its JSON projection with --json. Use when asked 'where are we' or 'progress status', or to show the report state."
    - name: speckit.progress.theme
      file: commands/theme.md
      description: "Sets the progress report's look from a preset (sanduq, cobalt, emerald, classic), the project's Illustrate theme or a theme file, or shows the active theme. Use when asked to 'change the report theme' or 'match the Illustrate colors'."
    - name: speckit.progress.export
      file: commands/export.md
      description: "Writes the current progress projection as deterministic Markdown or JSON, the same data as the live view at no model cost. Use when a static copy is needed, or when asked to 'export the progress report' or 'save the report as Markdown'."

hooks:
  after_tasks:
    command: speckit.progress.init
    optional: true
    prompt: "Create the live progress report for this feature?"
    description: "Create the report as soon as the task list exists"
  after_implement:
    command: speckit.progress.refresh
    optional: true
    prompt: "Write a final progress snapshot?"
    description: "Forces one snapshot. It does not declare the feature complete"

events:
  session_start:
    command: speckit.progress.hook
    timeout: 10
  pre_tool_use:
    command: speckit.progress.hook
    matcher: "Task|Agent|spawn_agent"
    timeout: 10
  post_tool_use:
    command: speckit.progress.hook
    timeout: 10
  stop:
    command: speckit.progress.hook
    timeout: 10
  session_end:
    command: speckit.progress.hook
    timeout: 10

tags:
  - "progress"
  - "report"
  - "dashboard"
  - "lanes"
  - "telemetry"
  - "hooks"
  - "workflow"
