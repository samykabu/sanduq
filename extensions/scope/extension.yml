schema_version: "1.0"
extension:
  id: scope
  name: Speckit Scope
  version: "1.11.1"
  description: "Analyze GitHub issue scope, enforce prerequisites, review user-selected decomposition before publishing, and maintain parent progress."
  author: "Samy K. Abushanab"
  repository: "https://github.com/samykabu/sanduq"
  license: MIT
requires:
  speckit_version: ">=1.0.0"
  extensions:
    - id: workflow
      version: ">=1.13.0,<2.0.0"
      required: true
    - id: illustrate
      version: ">=2.2.1,<3.0.0"
      required: true
  tools:
    - name: gh
      required: true
    - name: python
      version: ">=3.10"
      required: true
provides:
  commands:
    - name: speckit.scope.run
      file: commands/run.md
      description: "Scopes a GitHub issue: checks prerequisites, sizes effort, asks how many sub-issues to create and publishes only an approved decomposition. Use when asked to scope, size, estimate or split an issue."
    - name: speckit.scope.guard
      file: commands/guard.md
      description: "Runs as the before_specify hook: blocks Specify unless the issue has a fresh approved scope. Use when asked to specify an issue."
    - name: speckit.scope.bind
      file: commands/bind.md
      description: "Runs as the after_specify hook: binds the new spec to its source issue. Use when asked to bind a spec after Specify."
    - name: speckit.scope.reconcile
      file: commands/reconcile.md
      description: "Runs as the after_implement hook: refreshes Scope parent progress. Use when asked to update stale parent progress."
    - name: speckit.scope.plan
      file: commands/plan.md
      description: "Redraws and validates the dependency plan with Illustrate after a Scope split is published. Use when asked to refresh the plan, or when the scope plan-pending marker exists."
    - name: speckit.scope.after-specify
      file: commands/after-specify.md
      description: "Runs as an after_specify hook: starts the clarification round for the bound issue. Use when asked to clarify after Specify."
    - name: speckit.scope.plan-guard
      file: commands/plan-guard.md
      description: "Runs as the before_plan hook: stops Plan unless the bound issue is Ready. Use when asked to plan an issue-bound spec."
hooks:
  before_specify:
    command: speckit.scope.guard
    priority: 1
    optional: false
    description: "Block Specify before side effects unless the explicit GitHub issue has a fresh scope and eligible prerequisites."
  after_specify:
    - command: speckit.scope.bind
      priority: 1
      optional: false
      description: "Bind the source issue and set Feature Specification before Project sync."
    - command: speckit.scope.after-specify
      priority: 30
      optional: false
      description: "Run unattended Brainstorm when available, otherwise Clarify, after the spec is created."
  before_plan:
    command: speckit.scope.plan-guard
    priority: 1
    optional: false
    description: "Require Ready before technical planning; unresolved clarification must not be bypassed."
  after_implement:
    command: speckit.scope.reconcile
    priority: 30
    optional: false
    description: "Reconcile scope parents after Project sync updates child progress."
tags:
  - github
  - scope
  - workflow
  - dependencies
