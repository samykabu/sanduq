<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI compute budget · Sankey · Hand-drawn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sankey · Diagram Design · Hand</p>
    <h1>CI compute budget · a month of pipeline minutes</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" data-sankey="true" role="img" aria-labelledby="sankey-title sankey-desc">
      <title id="sankey-title">CI compute budget · a month of pipeline minutes</title>
      <desc id="sankey-desc">Sankey diagram showing 12,000 monthly CI minutes splitting into unit test, E2E, build, and lint stages, then merging into passed, failed, and flaked outcomes, with the flaky-rerun path highlighted as the one accent flow.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"></rect>

      <!-- Column headers -->
      <text x="124" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BUDGET</text>
      <text x="504" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEST STAGE</text>
      <text x="884" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OUTCOME</text>

      <!-- Ribbons: col1 -> col2. Both control points sit on the midpoint x, so every band
           meets its node bar horizontally at each end rather than arriving at a slant. -->
      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M132,120 C316,120 316,120 500,120 L500,224 C316,224 316,224 132,224 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path></g>

      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M132,304 C316,304 316,368 500,368 L500,408 C316,408 316,344 132,344 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path></g>
      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M132,344 C316,344 316,440 500,440 L500,456 C316,456 316,360 132,360 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path></g>

      <!-- Ribbons: col2 -> col3, ordinary. Each source stacks its outgoing bands in target
           order and each target stacks its incoming bands in source order, which is what
           keeps every bar exactly saturated. Four sources feeding three outcomes cannot be
           drawn crossing-free; what remains is the minimum. -->
      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M512,136 C696,136 696,148 880,148 L880,236 C696,236 696,224 512,224 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path></g>

      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M512,448 C696,448 696,368 880,368 L880,376 C696,376 696,456 512,456 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path></g>

      <g class="rough-shape" data-source-tag="path"><path class="rough-fill-mask" d="M512,256 C696,256 696,136 880,136 L880,140 C696,140 696,260 512,260 Z" fill="rgba(235,108,54,0.28)" stroke="none"></path></g>

      <!-- Nodes -->
      <g class="rough-shape" data-source-tag="rect"><path class="rough-fill-mask" d="M122 121.416 L126 122.413 L130 122.456 L130.242 161.333 L129.744 200.667 L130.458 240 L129.575 279.333 L130.089 318.667 L130.62 358 L126 358.22 L122 357.758 L122.147 318.667 L121.898 279.333 L121.867 240 L121.442 200.667 L121.543 161.333 Z" fill="#2d3142" stroke="none"></path></g>

      <g class="rough-shape" data-source-tag="rect"><path class="rough-fill-mask" d="M502 369.417 L506 370.039 L510 369.862 L509.462 388 L509.963 406 L506 405.391 L502 406.086 L501.605 388 Z" fill="#2d3142" stroke="none"></path></g>

      <!-- Labels: column 1, outside, anchored end -->
      <text x="104" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">CI minutes</text>
      <text x="104" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">12,000 min</text>

      <!-- Labels: column 2, centred in the gutter above the bar, where the bands separate. -->

      <text x="504" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unit tests</text>
      <text x="504" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5,200 min</text>

      <text x="504" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E2E</text>
      <text x="504" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4,000 min</text>

      <text x="504" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build</text>
      <text x="504" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2,000 min</text>

      <text x="504" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lint</text>
      <text x="504" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">800 min</text>

      <!-- Labels: column 3, outside, anchored start -->

      <text x="908" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Flaked</text>
      <text x="908" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">1,000 min</text>

      <text x="908" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Passed</text>
      <text x="908" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">9,400 min</text>

      <text x="908" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Failed</text>
      <text x="908" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">1,600 min</text>

      <!-- Legend -->
      <g class="rough-shape" data-source-tag="line"><path class="rough-generated" d="M40 492 C247.05159469839188 487.96724807568825, 455.2992961369083 487.85428041645326, 960 492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g>
      <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <g class="rough-shape" data-source-tag="rect"><path class="rough-fill-mask" d="M42 521.681 L48 522.313 L54 521.975 L54.254 524 L54.219 526 L48 525.901 L42 525.906 L41.955 524 Z" fill="rgba(79,93,117,0.18)" stroke="none"></path><path class="rough-generated" d="M38.73804595023394 521.6160637423396 L55.01290647536516 519.0084723517299 L55.56889035254717 528.3062078043819 L42.55692531615496 529.3419361159206" stroke="none" stroke-width="0" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path class="rough-generated" d="M40 520 C44.05812144160271 519.3005951349437, 45.19244058012963 518.3645900003612, 56 520 M56 520 C56.88761340774596 522.6799705404044, 57.201587769165634 524.5145355194808, 56 528 M56 528 C52.757127856016155 528.695987828523, 44.83355967879295 527.3937656529248, 40 528 M40 528 C40.04203787527978 525.0248443549871, 40.69569668494165 522.7380897015332, 40 520" stroke="#4f5d75" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g>
      <text x="64" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow · stage routing</text>

      <g class="rough-shape" data-source-tag="rect"><path class="rough-fill-mask" d="M222 521.682 L228 521.779 L234 521.866 L234.112 524 L234.259 526 L228 525.707 L222 525.766 L222.333 524 Z" fill="rgba(235,108,54,0.28)" stroke="none"></path><path class="rough-generated" d="M217.16390898106619 522.2504250464029 L238.06741491733118 521.3854744938202 L234.4392911958508 527.2253149149008 L217.77625717697666 526.3101898399182" stroke="none" stroke-width="0" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path class="rough-generated" d="M220 520 C224.724579430297 521.9393059820402, 225.84934077419342 520.2932310313452, 236 520 M236 520 C234.99861312781925 522.4417225879804, 236.2223698190367 525.2902882089093, 236 528 M236 528 C230.09313768036665 529.3398022503685, 227.58538491286336 529.5803048295808, 220 528 M220 528 C220.91880063238088 525.2584523240105, 220.70485121550504 521.1366985912994, 220 520" stroke="#eb6c36" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g>
      <text x="244" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flaked path · reruns</text>

      <g class="rough-shape" data-source-tag="rect"><path class="rough-fill-mask" d="M422 521.682 L428 521.944 L434 521.758 L433.969 524 L434.299 526 L428 526.212 L422 526.325 L422.012 524 Z" fill="#2d3142" stroke="none"></path></g>
      <text x="444" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Node · stage total</text>

      <text x="600" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Two coral ribbons — flaky reruns burn ~8% of the monthly CI budget.</text>
    </svg>
  </div>


</body></html>
