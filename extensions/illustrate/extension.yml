schema_version: "1.0"

extension:
  id: illustrate
  name: "Illustrate"
  version: "2.4.2"
  description: "Generate, import, and export forty-four technical, product, architecture, process, and quantitative illustration types with tracked project-level light/dark color and font themes."
  author: "Samy K. Abushanab"
  repository: "https://github.com/samykabu/sanduq"
  category: "documentation"
  license: PolyForm-Noncommercial-1.0.0

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.illustrate.generate
      file: commands/speckit.illustrate.generate.md
      description: 'Draws one of 44 diagram types (architecture, sequence, flowchart, ER, Gantt, Sankey, charts) as themed HTML with inline SVG using the installed Illustrate skill. Use when asked to "draw a diagram", "chart this" or "visualize" something for a spec, doc or PR.'
    - name: speckit.illustrate.export
      file: commands/speckit.illustrate.export.md
      description: 'Exports an Illustrate HTML diagram to standalone SVG, transparent PNG, animated SVG or GIF with the bundled exporter, keeping the HTML as the source. Use when asked to "export the diagram" or "make a PNG of this chart".'
    - name: speckit.illustrate.theme
      file: commands/speckit.illustrate.theme.md
      description: 'Initializes, selects, validates or creates the tracked Illustrate color and font theme of a project in .github/illustration-theme.yml. Use when asked to "set the diagram theme", "use the dark theme" or "create a brand theme".'
    - name: speckit.illustrate.import
      file: commands/speckit.illustrate.import.md
      description: 'Redraws a draw.io, Mermaid or Excalidraw source as an Illustrate diagram in the project theme and reports a fidelity ledger. Use when asked to "import this .drawio", "redraw the Mermaid diagram" or "convert an .excalidraw file".'

events:
  post_tool_use:
    command: speckit.illustrate.hook
    matcher: "Write|Edit"
    timeout: 60

tags:
  - "diagram"
  - "architecture"
  - "process-flow"
  - "technical-color"
  - "flowchart"
  - "sequence"
  - "state-machine"
  - "er"
  - "timeline"
  - "swimlane"
  - "radar"
  - "gantt"
  - "data-platform"
  - "export"
  - "png"
  - "pdf"
  - "svg"
  - "visualization"
  - "documentation"
  - "project-theme"
  - "custom-fonts"
  - "sankey"
  - "waterfall"
  - "heatmap"
  - "deployment"
  - "uml"
  - "mermaid"
  - "drawio"
  - "excalidraw"
  - "animation"
