schema_version: "1.0"

extension:
  id: user-manual
  name: "User Manual"
  version: "1.5.4"
  description: "Create and incrementally maintain bilingual-ready, audience-aware application manuals in Markdown, themeable MkDocs HTML (Material, ReadTheDocs, or any installed theme), and PDF, including modules, interfaces, tutorials, screenshots, APIs, releases, migrations, infrastructure, architecture, and complete data dictionaries."
  author: "Samy K. Abushanab"
  repository: "https://github.com/samykabu/sanduq"
  category: "documentation"
  license: PolyForm-Noncommercial-1.0.0

requires:
  speckit_version: ">=0.2.0"
  extensions:
    - id: illustrate
      version: ">=2.0.0,<3.0.0"
      required: true
  tools:
    - name: git
      required: false
    - name: python
      required: true
    - name: node
      required: false

provides:
  commands:
    - name: speckit.user-manual.init
      file: commands/speckit.user-manual.init.md
      description: "Discovers the application, proposes a module map for approval and scaffolds the bilingual-ready, audience-aware User Manual. Use when a project has no User-Manual/ yet or its module map needs a refresh; triggers: 'create a user manual', 'init the manual'."
    - name: speckit.user-manual.analyze
      file: commands/speckit.user-manual.analyze.md
      description: "Adds User Manual content and asset tasks for the active feature to tasks.md before implementation. Use when tasks.md exists and the manual must follow the feature; triggers: 'which manual pages does this feature touch', 'add documentation tasks'."
    - name: speckit.user-manual.update
      file: commands/speckit.user-manual.update.md
      description: "Updates the affected User Manual modules for the implemented feature, audits them and builds a private preview. Use when a feature is implemented or the manual is missing; triggers: 'update the user manual', 'build the manual preview'."
    - name: speckit.user-manual.release
      file: commands/speckit.user-manual.release.md
      description: "Builds versioned User Manual release notes, migration guides, HTML archives and PDFs per audience and language. Use when an application release is tagged or merged, never on a feature branch; triggers: 'release the manual', 'build the v3 manual PDFs'."

hooks:
  after_tasks:
    command: speckit.user-manual.analyze
    optional: true
    prompt: "Analyze which User Manual modules and assets this feature must update?"
    description: "Add documentation and evidence work to tasks.md before implementation"
  after_implement:
    command: speckit.user-manual.update
    optional: true
    prompt: "Update the audience-aware User Manual and generate a private preview?"
    description: "Update affected manual modules after implemented behavior can be observed"

tags:
  - "user-manual"
  - "documentation"
  - "mkdocs"
  - "material"
  - "pdf"
  - "bilingual"
  - "arabic"
  - "rtl"
  - "api"
  - "tutorial"
  - "release-notes"
  - "migration-guide"
  - "screenshots"
  - "architecture"
  - "infrastructure"
  - "data-dictionary"
