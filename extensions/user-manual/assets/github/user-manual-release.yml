name: User Manual release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-manual:
    runs-on: __sanduq_runs_on_linux__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sanduq:if python_setup_action
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "__sanduq_python_version__"
          cache: pip
          cache-dependency-path: User-Manual/requirements*.lock
      # sanduq:endif
      - name: Install the manual tools
        id: renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r User-Manual/requirements.lock
          kind="$(python .specify/extensions/user-manual/scripts/build_manual.py --root User-Manual --print-renderer)"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          # The mkdocs renderer builds PDFs; a renderer command's own tool is installed on the runner (or in a step here).
          if [ "$kind" = mkdocs ]; then python -m pip install -r User-Manual/requirements-pdf.lock; fi
      # sanduq:if system_packages_apt
      - name: Install PDF system dependencies
        if: steps.renderer.outputs.kind == 'mkdocs'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0 fonts-hosny-amiri
      # sanduq:endif
      - name: Audit and build release editions
        shell: bash
        env:
          RENDERER: ${{ steps.renderer.outputs.kind }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          python .specify/extensions/user-manual/scripts/audit_manual.py --root User-Manual
          pdf=""
          if [ "$RENDERER" = mkdocs ]; then pdf="--pdf"; fi
          python .specify/extensions/user-manual/scripts/build_manual.py --root User-Manual --all --version "$version" --archive $pdf
      - name: Upload release build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-manual-${{ github.ref_name }}
          path: |
            User-Manual/site/${{ github.ref_name }}/
            User-Manual/pdf/${{ github.ref_name }}/
          if-no-files-found: error
      - name: Attach manual artifacts to GitHub release when present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "User-Manual/pdf/$GITHUB_REF_NAME"  # only the mkdocs renderer writes PDFs
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            find "User-Manual/site/$GITHUB_REF_NAME" "User-Manual/pdf/$GITHUB_REF_NAME" -type f \
              \( -name '*.zip' -o -name '*.pdf' \) -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
          fi
