      <desc id="streamgraph-desc">Streamgraph of weekly CI build minutes by pipeline across twelve weeks, stacked on a symmetric baseline so the envelope height reads as the total; the end-to-end suite grows from 12 to 118 minutes a week and passes the unit suite in week eight, while the docs pipeline pauses to zero in weeks five and six.</desc>

          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"></circle>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"></rect>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"></rect>
