<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>delegate-task · Run lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&family=Noto+Naskh+Arabic:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f8fc;
      --color-paper-2: #ffffff;
      --color-ink:     #15233c;
      --color-muted:   #4f6078;
      --color-soft:    #6b7a90;
      --color-accent:  #2563eb;
      --color-link:    #1d4ed8;
      --font-sans:     'IBM Plex Sans', 'Noto Sans Arabic', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', 'Noto Naskh Arabic', serif;
      --font-mono:     'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .dek {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Illustrate</p>
    <h1>One delegated run, start to collect</h1>
    <p class="dek">The baseline is taken <em>before</em> the harness launches. That ordering is what
    makes the closing delta attributable to this run rather than to everything already dirty in the
    tree.</p>

    <svg viewBox="0 0 1024 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f6078"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
        </marker>
      </defs>

      <!-- Background: clean paper, no dot pattern (figure is embedded in a README) -->
      <rect width="100%" height="100%" fill="#f6f8fc"/>

      <!-- =================================================================
           LIFELINES — actor x-centres: 112, 320, 528, 720, 912
           ================================================================= -->
      <line x1="112" y1="128" x2="112" y2="600" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="128" x2="320" y2="600" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="528" y1="128" x2="528" y2="600" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="720" y1="128" x2="720" y2="600" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="912" y1="128" x2="912" y2="600" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           ACTIVATION BARS — the caller holds control twice, briefly. The gap
           between them IS the point: the run is in flight and nobody waits.
           ================================================================= -->
      <rect x="108" y="168" width="8" height="56" fill="rgba(21,35,60,0.06)" stroke="#4f6078" stroke-width="0.8"/>
      <rect x="108" y="556" width="8" height="32" fill="rgba(21,35,60,0.06)" stroke="#4f6078" stroke-width="0.8"/>
      <!-- Supervisor: holds control from spawn to the single result write -->
      <rect x="316" y="172" width="8" height="360" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="0.8"/>
      <!-- Harness: launched, then exits -->
      <rect x="524" y="312" width="8" height="96" fill="rgba(21,35,60,0.06)" stroke="#4f6078" stroke-width="0.8"/>

      <!-- =================================================================
           MESSAGES — time flows top to bottom. Drawn before labels.
           ================================================================= -->

      <!-- M1: caller spawns the supervisor -->
      <line x1="112" y1="176" x2="316" y2="176" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M2: run_id straight back — the caller is free from here -->
      <line x1="316" y1="216" x2="116" y2="216" stroke="#4f6078" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M3: THE ordering that matters — baseline before launch (accent) -->
      <line x1="324" y1="264" x2="720" y2="264" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- M4: launch the harness -->
      <line x1="324" y1="312" x2="524" y2="312" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M5: session id arrives mid-run on the live stream -->
      <line x1="524" y1="356" x2="324" y2="356" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

      <!-- M6: harness exits -->
      <line x1="524" y1="404" x2="324" y2="404" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M7: compare against the baseline -->
      <line x1="324" y1="448" x2="720" y2="448" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M8: the delta comes back -->
      <line x1="720" y1="492" x2="324" y2="492" stroke="#4f6078" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M9: written exactly once (accent — the single-writer rule) -->
      <line x1="324" y1="532" x2="912" y2="532" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- M10: collect, whenever the caller comes back -->
      <line x1="112" y1="572" x2="908" y2="572" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- =================================================================
           MESSAGE LABELS — opaque paper mask, 8px clear of the stroke.
           ================================================================= -->

      <rect x="164" y="156" width="100" height="12" rx="2" fill="#f6f8fc"/>
      <text x="214" y="166" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN DETACHED</text>

      <rect x="160" y="196" width="108" height="12" rx="2" fill="#f6f8fc"/>
      <text x="214" y="206" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN_ID · NO WAITING</text>

      <rect x="452" y="244" width="140" height="12" rx="2" fill="#f6f8fc"/>
      <text x="522" y="254" fill="#2563eb" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASELINE · BEFORE LAUNCH</text>

      <rect x="372" y="292" width="104" height="12" rx="2" fill="#f6f8fc"/>
      <text x="424" y="302" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAUNCH · PROMPT</text>

      <rect x="376" y="336" width="96" height="12" rx="2" fill="#f6f8fc"/>
      <text x="424" y="346" fill="#1d4ed8" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESSION ID · LIVE</text>

      <rect x="372" y="384" width="104" height="12" rx="2" fill="#f6f8fc"/>
      <text x="424" y="394" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXIT CODE · SIGNAL</text>

      <rect x="468" y="428" width="108" height="12" rx="2" fill="#f6f8fc"/>
      <text x="522" y="438" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPARE TO BASELINE</text>

      <rect x="476" y="472" width="92" height="12" rx="2" fill="#f6f8fc"/>
      <text x="522" y="482" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELTA · NOT DIRT</text>

      <rect x="560" y="512" width="116" height="12" rx="2" fill="#f6f8fc"/>
      <text x="618" y="522" fill="#2563eb" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITTEN EXACTLY ONCE</text>

      <rect x="756" y="552" width="112" height="12" rx="2" fill="#f6f8fc"/>
      <text x="812" y="562" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COLLECT · ANY TIME</text>

      <!-- =================================================================
           ACTOR BOXES — drawn last so they sit above the lifelines.
           ================================================================= -->

      <!-- Caller (external) -->
      <rect x="40" y="72" width="144" height="56" rx="6" fill="#f6f8fc"/>
      <rect x="40" y="72" width="144" height="56" rx="6" fill="rgba(79,96,120,0.10)" stroke="#6b7a90" stroke-width="1"/>
      <rect x="48" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(107,122,144,0.40)" stroke-width="0.8"/>
      <text x="62" y="89" fill="#6b7a90" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YOU</text>
      <text x="112" y="104" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Caller</text>
      <text x="112" y="119" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">start · collect</text>

      <!-- Supervisor (focal) -->
      <rect x="248" y="72" width="144" height="56" rx="6" fill="#f6f8fc"/>
      <rect x="248" y="72" width="144" height="56" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="1"/>
      <rect x="256" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(37,99,235,0.50)" stroke-width="0.8"/>
      <text x="272" y="89" fill="#2563eb" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="320" y="104" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Supervisor</text>
      <text x="320" y="119" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">detached</text>

      <!-- Harness CLI -->
      <rect x="456" y="72" width="144" height="56" rx="6" fill="#f6f8fc"/>
      <rect x="456" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <rect x="464" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
      <text x="478" y="89" fill="#4f6078" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="528" y="104" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Harness</text>
      <text x="528" y="119" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">codex · claude</text>

      <!-- Git worktree (store) -->
      <rect x="648" y="72" width="144" height="56" rx="6" fill="#f6f8fc"/>
      <rect x="648" y="72" width="144" height="56" rx="6" fill="rgba(21,35,60,0.05)" stroke="#4f6078" stroke-width="1"/>
      <rect x="656" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,96,120,0.40)" stroke-width="0.8"/>
      <text x="670" y="89" fill="#4f6078" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="720" y="104" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Working tree</text>
      <text x="720" y="119" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">HEAD · index</text>

      <!-- result.json (store) -->
      <rect x="840" y="72" width="144" height="56" rx="6" fill="#f6f8fc"/>
      <rect x="840" y="72" width="144" height="56" rx="6" fill="rgba(21,35,60,0.05)" stroke="#4f6078" stroke-width="1"/>
      <rect x="848" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,96,120,0.40)" stroke-width="0.8"/>
      <text x="864" y="89" fill="#4f6078" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="912" y="104" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">result.json</text>
      <text x="912" y="119" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">schema v2</text>

      <!-- =================================================================
           LEGEND — horizontal strip, below the diagram body.
           ================================================================= -->
      <line x1="40" y1="628" x2="984" y2="628" stroke="rgba(21,35,60,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="664" width="14" height="10" rx="2" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="672" fill="#4f6078" font-size="8.5" font-family="'IBM Plex Sans', sans-serif">Focal actor</text>

      <rect x="176" y="660" width="4" height="18" fill="rgba(21,35,60,0.06)" stroke="#4f6078" stroke-width="0.8"/>
      <text x="188" y="672" fill="#4f6078" font-size="8.5" font-family="'IBM Plex Sans', sans-serif">Holds control</text>

      <line x1="304" y1="670" x2="332" y2="670" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="340" y="672" fill="#4f6078" font-size="8.5" font-family="'IBM Plex Sans', sans-serif">Load-bearing step</text>

      <line x1="480" y1="670" x2="508" y2="670" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <text x="516" y="672" fill="#4f6078" font-size="8.5" font-family="'IBM Plex Sans', sans-serif">Live stream</text>

      <line x1="640" y1="670" x2="668" y2="670" stroke="#4f6078" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="676" y="672" fill="#4f6078" font-size="8.5" font-family="'IBM Plex Sans', sans-serif">Return</text>
    </svg>
  </div>
</body>
</html>
