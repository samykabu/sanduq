name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run, including the Windows workflow suite. The release gate only accepts
  # `push` runs on main (release-extensions.yml), so this never triggers a release.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  # Decides which expensive jobs run. Skipped jobs count as success for the release gate.
  changes:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'homek8-general' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_regression: ${{ steps.matrix.outputs.has_regression }}
      memory_install: ${{ steps.matrix.outputs.memory_install }}
      install_smoke: ${{ steps.matrix.outputs.install_smoke }}
      illustrate_vendored: ${{ steps.matrix.outputs.illustrate_vendored }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: matrix
        run: |
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; head="$PR_HEAD"
          else base="$PUSH_BEFORE"; head="$SHA"; fi
          python3 .github/scripts/ci_matrix.py --event "$EVENT" --base "$base" --head "$head"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}

  lint:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'homek8-general' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: No private product names (pattern held in the PRIVATE_NAMES repository secret)
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: |
          if [ -z "$PRIVATE_NAMES" ]; then echo "::notice::PRIVATE_NAMES is not set; the private-name check was skipped"; exit 0; fi
          if git grep -I -i -n -E "$PRIVATE_NAMES" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Private product or customer names found (lines above). Remove them; this repository never names third-party products."; exit 1
          fi

      - name: Install validation dependencies
        run: python3 -m pip install --user pyyaml packaging

      - name: Claude Code validates the marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.310 plugin validate .

      - name: Skills follow the Agent Skills frontmatter rules
        run: python3 extensions/scripts/validate_skills.py extensions presets

      - name: Vendored skills match vendor.lock.json
        run: python3 extensions/scripts/vendor.py check

      - name: No installable skills are listed from this repository
        run: |
          npx -y skills@1.7.2 add . --list > skills-list.txt 2>&1 || true
          cat skills-list.txt
          if grep -Eq 'illustrate|user-manual|delegate-task|scope-analyst|workflow' skills-list.txt; then
            echo "a skill is discoverable here; skills live in samykabu/sanduq-skills"; exit 1
          fi
          # Named installs reach only byte-identical vendored copies, which must still work (R2).
          mkdir -p /tmp/named && cd /tmp/named && git init -q
          npx -y skills@1.7.2 add "$GITHUB_WORKSPACE" --skill delegate-task -a codex -y
          node .agents/skills/delegate-task/delegate.mjs contract > /dev/null
          npx -y skills@1.7.2 add "$GITHUB_WORKSPACE" --skill illustrate -a codex -y
          test -f .agents/skills/illustrate/scripts/export_diagram.py

      - name: Check documentation links and command coverage
        run: |
          python3 extensions/scripts/test_check_docs.py
          python3 extensions/scripts/check_docs.py
          python3 extensions/user-manual/scripts/audit_manual.py --root docs/examples/booking-manual

      # X23: shipped files changed without a version bump (or a pending release above the catalog) fail.
      - name: Packages changed without a version bump
        run: python3 extensions/scripts/release.py check-bumps

      - name: Repository tooling tests (CI matrix, vendoring, packaging)
        run: python3 -m unittest discover -s extensions/scripts/tests -q

      - name: Documentation diagrams end their arrows straight
        run: python3 extensions/illustrate/skill/scripts/verify-arrow-ends.py docs/diagrams/*.html docs/diagrams/*.svg

      - name: Validate JSON (catalog + configs + marketplace)
        run: |
          while IFS= read -r f; do
            echo "checking $f"; jq empty "$f"
          done < <(
            {
              printf '%s\n' catalog.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json
              find extensions -path '*/node_modules/*' -prune -o -name '*.json' -print
            } | sort -u
          )

      - name: Validate extension and marketplace manifests
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys, yaml
          from packaging.specifiers import InvalidSpecifier, SpecifierSet
          from packaging.version import InvalidVersion, Version

          root = pathlib.Path(".")
          root_catalog = json.loads((root / "catalog.json").read_text(encoding="utf-8"))
          ext_catalog = json.loads((root / "extensions/catalog.json").read_text(encoding="utf-8"))
          pending_path = root / "extensions/pending-releases.json"
          pending = json.loads(pending_path.read_text(encoding="utf-8")).get("versions", {}) if pending_path.exists() else {}
          if root_catalog != ext_catalog:
              sys.exit("catalog.json and extensions/catalog.json must match")

          for yml_path in sorted(glob.glob("extensions/*/extension.yml")):
              path = pathlib.Path(yml_path)
              doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              meta = doc.get("extension") or {}
              ext_id = meta.get("id") or path.parent.name
              if ext_id != path.parent.name:
                  sys.exit(f"{path}: extension.id must match directory name")
              entry = root_catalog.get("extensions", {}).get(ext_id)
              if ext_id in pending:
                  if pending[ext_id] != str(meta.get("version")):
                      sys.exit(f"{path}: pending release version does not match manifest")
                  if entry and Version(pending[ext_id]) <= Version(entry["version"]):
                      sys.exit(f"{path}: pending version must be newer than published catalog")
                  # Pending releases are validated without publishing broken download URLs.
                  entry = {"version": pending[ext_id], "requires": doc.get("requires") or {},
                           "download_url": f"https://github.com/samykabu/sanduq/releases/download/{ext_id}-v{pending[ext_id]}/{ext_id}.zip"}
              if not entry:
                  sys.exit(f"{path}: missing catalog entry for {ext_id}")
              if str(entry.get("version")) != str(meta.get("version")):
                  sys.exit(f"{path}: catalog version {entry.get('version')} != extension.yml {meta.get('version')}")
              if f"/{ext_id}-v{meta.get('version')}/" not in entry.get("download_url", ""):
                  sys.exit(f"{path}: download_url does not match extension version")
              manifest_requires = doc.get("requires") or {}
              catalog_requires = entry.get("requires") or {}
              if catalog_requires != manifest_requires:
                  sys.exit(f"{path}: catalog requires metadata must match extension.yml")
              for dependency in manifest_requires.get("extensions", []):
                  dep_id = dependency.get("id")
                  constraint = dependency.get("version", "")
                  dep_entry = root_catalog.get("extensions", {}).get(dep_id)
                  if dep_id in pending:
                      dep_entry = {"version": pending[dep_id]}
                  if not dep_entry:
                      sys.exit(f"{path}: required extension {dep_id!r} is missing from catalog")
                  try:
                      compatible = Version(str(dep_entry.get("version"))) in SpecifierSet(constraint)
                  except (InvalidSpecifier, InvalidVersion) as exc:
                      sys.exit(f"{path}: invalid dependency version contract for {dep_id}: {exc}")
                  if not compatible:
                      sys.exit(
                          f"{path}: catalog {dep_id} version {dep_entry.get('version')} "
                          f"does not satisfy {constraint}"
                      )

          marketplace = json.loads((root / ".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          for plugin in marketplace.get("plugins", []):
              source = plugin.get("source")
              # Bundles install from samykabu/sanduq-skills at a pinned commit; plugin.json owns the version.
              if not (isinstance(source, dict) and source.get("source") == "git-subdir"
                      and source.get("url", "").startswith("https://github.com/samykabu/sanduq-skills")
                      and source.get("path") == f"skills/{plugin.get('name')}" and source.get("ref")
                      and len(source.get("sha", "")) == 40):
                  sys.exit(f"marketplace plugin {plugin.get('name')}: expected a pinned git-subdir source")
              if "version" in plugin:
                  sys.exit(f"marketplace plugin {plugin.get('name')}: version belongs in plugin.json")

          print("extension/catalog/plugin manifest validation ok")
          PY

      # SEC-09 pins: npx: <pkg>@<version>; Install-Module: -RequiredVersion; OS packages belong in the
      # runner image. Allowed until they move into the homek8-general image (runner-image work): shellcheck
      # from apt-get below, and the Chromium OS libraries that `playwright install --with-deps` installs.
      # The [x]/[e]/[t] brackets keep these patterns from matching their own lines.
      - name: Workflow tool installs are pinned
        run: |
          {
            grep -nE 'np[x] +(-y +)?(@[a-z0-9._-]+/)?[a-z0-9_.][a-z0-9._-]*( |$)' .github/workflows/*.yml
            grep -nE 'Install-Modul[e] ' .github/workflows/*.yml | grep -v -- '-RequiredVersion '
            grep -nE 'apt-ge[t] +install' .github/workflows/*.yml | grep -vF 'sudo apt-get install -y shellcheck'
          } > "$RUNNER_TEMP/unpinned.txt" || true
          if [ -s "$RUNNER_TEMP/unpinned.txt" ]; then
            cat "$RUNNER_TEMP/unpinned.txt"
            echo "::error::Unpinned tool install in .github/workflows (see the lines above): npx: <pkg>@<version>; Install-Module: -RequiredVersion; OS packages: the runner image."
            exit 1
          fi

      - name: ShellCheck bash scripts
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          find extensions -name '*.sh' -print -exec shellcheck -S warning {} +

      # After ShellCheck, so actionlint also checks every `run:` script with it.
      - name: Lint the workflow files (actionlint)
        env:
          ACTIONLINT: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: PSScriptAnalyzer PowerShell scripts
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $issues = Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning
          }
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer found errors' }

  # Path-filtered by .github/scripts/ci_matrix.py: extensions/<suite>/** runs that suite (plus its
  # dependents); release metadata, docs and repository tooling are lint-only; injected shared files run
  # the suites that ship them; other shared paths run all. Windows workflow and Windows memory run on PRs
  # and nightly only, as shards weighted by .github/scripts/shard_weights.json (workflow four by module,
  # memory two by test class). Linux runs the whole workflow suite as four shards too, and every other
  # selected suite in one batch job, each suite in its own log group with its own exit code.
  # Progress runs its default (non-browser) set; Progress browser tests are not vendored here.
  regression:
    needs: changes
    if: needs.changes.outputs.has_regression == 'true'
    name: regression (${{ matrix.os }}, ${{ matrix.suite }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'homek8-general' }}
    # Tests create and delete many temporary repositories; a detached `git gc --auto` or background
    # maintenance writing into one while it is removed fails cleanup (Errno 39) on Linux.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: '0'
      GIT_CONFIG_KEY_1: maintenance.auto
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            extensions/workflow/requirements.txt
            extensions/*/test-requirements.txt
      - run: python -m pip install -r extensions/workflow/test-requirements.txt
      - name: Install Progress test requirements
        if: contains(matrix.suites, 'progress')
        run: python -m pip install -r extensions/progress/test-requirements.txt
      # Only the vendored render lint below needs a browser; the Illustrate suite imports none.
      # The browser cache saves the download only; --with-deps still installs Chromium's OS
      # libraries on every fresh runner.
      - name: Cache the Playwright browser
        if: contains(matrix.suites, 'illustrate') && runner.os == 'Linux' && needs.changes.outputs.illustrate_vendored == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ms-playwright-1.63.0-chromium-${{ runner.os }}-${{ runner.arch }}
      - name: Install Playwright for Illustrate render checks
        if: contains(matrix.suites, 'illustrate') && runner.os == 'Linux' && needs.changes.outputs.illustrate_vendored == 'true'
        shell: bash
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      # shard_times.py run is `python -m unittest -q` plus one seconds line per module or module.Class;
      # `shard_times.py rebuild` turns a downloaded log into .github/scripts/shard_weights.json.
      # One "<suite> <tests> [modules...]" line per suite (several in the Linux batch). Every suite runs, each
      # in its own log group with an rc line and an error annotation, and the step fails afterwards if any did.
      - name: Run the suites
        shell: bash
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          failed=()
          mapfile -t runs <<< "$RUNS"
          for line in "${runs[@]}"; do
            read -r suite tests modules <<< "$line"
            echo "::group::=== $suite"
            rc=0
            if [[ -n "$modules" ]]; then
              # A shard or a module list (modules or module.Class): import them from the suite folder, as
              # discover does.
              read -ra names <<< "$modules"
              PYTHONPATH="$tests" python .github/scripts/shard_times.py run "${names[@]}" || rc=$?
            else
              python -m unittest discover -s "$tests" -q || rc=$?
            fi
            echo "::endgroup::"
            echo "=== $suite rc=$rc"
            if (( rc )); then echo "::error title=regression $suite::$suite failed (rc=$rc)"; failed+=("$suite"); fi
          done
          if (( ${#failed[@]} )); then echo "Failed suites: ${failed[*]}"; exit 1; fi
      # The vendored skill is byte-checked against vendor.lock.json in lint and verified upstream on both
      # OSs at the locked sha, so its builders, verifiers and render lint run on Linux only, on a vendor
      # bump, on demand and on the weekly scheduled run (ci_matrix.py VENDORED_WEEKDAY).
      - name: Illustrate builders and verifiers
        if: ${{ !cancelled() && contains(matrix.suites, 'illustrate') && runner.os == 'Linux' && needs.changes.outputs.illustrate_vendored == 'true' }}
        shell: bash
        working-directory: extensions/illustrate/skill
        run: |
          python scripts/build-exploded-examples.py --check
          python scripts/build-axonometric-plan-examples.py --check
          python scripts/verify-exploded.py --all
          python scripts/verify-axonometric-plan.py --all
          python scripts/verify-motion.py --shipped
          python scripts/verify-semantic-motion.py
          python scripts/verify-geometry.py --all --baseline
          python scripts/verify-arrow-ends.py --all
          python scripts/lint-skin.py --all --baseline
          for v in architecture-delta treemap marimekko sankey heatmap waterfall slopegraph ridgeline streamgraph bump bubble beeswarm; do python scripts/verify-$v.py --all; done
          python scripts/verify-polar.py
          python scripts/verify-dumbbell.py
          python scripts/verify-sequence-oauth.py
          python scripts/verify-block-registry.py --all
      - name: Illustrate rendered-layout lint
        if: ${{ !cancelled() && contains(matrix.suites, 'illustrate') && runner.os == 'Linux' && needs.changes.outputs.illustrate_vendored == 'true' }}
        shell: bash
        working-directory: extensions/illustrate/skill
        run: |
          python scripts/lint-render.py --self-test
          python scripts/lint-render.py --all

  # Memory install smoke only exercises extensions/memory, so it follows that path filter.
  # installation, upgrade, project-init and dryrun run when an install-relevant path changed
  # (workflow, project, extension manifests, packaging and smoke scripts, presets, vendor.lock.json,
  # CI itself; see ci_matrix.py INSTALL_PREFIXES), and always nightly and on demand.
  # Linux runs them in two jobs, one per host, each installing core then SuperSpec. The claude leg also
  # runs the Project initialization and Memory registration smokes, the codex leg the upgrade smoke
  # (smoke_upgrade.py installs its own fresh codex project), so both legs take about as long. Each smoke
  # is its own step and runs even when an earlier one failed. A Memory-only change runs the claude leg
  # with the Memory smoke alone. dryrun stays its own job; the Windows legs follow below.
  # Spec Kit installs by name so pip reuses its cached wheel of the pinned commit (no clone).
  installation:
    needs: changes
    if: needs.changes.outputs.install_smoke == 'true' || needs.changes.outputs.memory_install == 'true'
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.changes.outputs.install_smoke == 'true' && '["claude", "codex"]' || '["claude"]') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'homek8-general' }}
    permissions:
      contents: read
    env:
      SMOKE: ${{ needs.changes.outputs.install_smoke }}
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          # ci.yml holds the Spec Kit pin, so a new pin gets a new pip cache.
          cache-dependency-path: |
            extensions/workflow/requirements.txt
            .github/workflows/ci.yml
      - name: Install the tested Spec Kit build
        run: python -m pip install 'specify-cli @ git+https://github.com/github/spec-kit.git@0282d03eb6fc3091b3deaa3a855d4030dc40cd6c' -r extensions/workflow/requirements.txt
      # These two ran without a global git identity in their own jobs, so they run before it is set.
      - name: Project initialization smoke
        if: ${{ !cancelled() && env.SMOKE == 'true' && matrix.host == 'claude' }}
        run: python extensions/scripts/smoke_project_init.py
      - name: Memory installation smoke
        if: ${{ !cancelled() && needs.changes.outputs.memory_install == 'true' && matrix.host == 'claude' }}
        run: python extensions/scripts/smoke_memory_install.py
      - name: Configure the git identity the smokes commit with
        run: |
          git config --global user.name 'Sanduq CI'
          git config --global user.email 'sanduq-ci@example.invalid'
      - name: Fetch the tested optional SuperSpec source
        if: env.SMOKE == 'true'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          repository: WangX0111/superspec
          ref: c20ac6c1ba069cc9a72dacb8044b7b193d3dde81
          path: dist/upstream-superspec
      - name: Clean installation and reinstallation (core)
        if: ${{ !cancelled() && env.SMOKE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python extensions/scripts/smoke_install.py --host "$HOST"
      - name: Clean installation and reinstallation (superspec)
        if: ${{ !cancelled() && env.SMOKE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python extensions/scripts/smoke_install.py --host "$HOST" --superspec-source "$GITHUB_WORKSPACE/dist/upstream-superspec"
      - name: Installed skills follow the Agent Skills frontmatter rules
        if: ${{ !cancelled() && env.SMOKE == 'true' }}
        shell: bash
        run: |
          folders=(dist/install-tests/*/project/.claude/skills dist/install-tests/*/project/.agents/skills)
          existing=(); for f in "${folders[@]}"; do [[ -d "$f" ]] && existing+=("$f"); done
          python extensions/scripts/validate_skills.py "${existing[@]}"
      - name: Verify actual version upgrade and failure rollback
        if: ${{ !cancelled() && env.SMOKE == 'true' && matrix.host == 'codex' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python extensions/scripts/smoke_upgrade.py
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installation-${{ matrix.host }}
          retention-days: 7
          path: |
            dist/install-tests/*/result.json
            dist/install-tests/*/upgrade-result.json
            dist/install-tests/*/*.log
            dist/project-init-tests/*/result.json
            dist/project-init-tests/*/execution.log
            dist/memory-install-tests/
          if-no-files-found: ignore

  # The Windows legs of the Memory and Project initialization smokes (GitHub-hosted, see README).
  memory-installation:
    needs: changes
    if: needs.changes.outputs.memory_install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'homek8-general' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          # ci.yml holds the Spec Kit pin, so a new pin gets a new pip cache.
          cache-dependency-path: |
            extensions/workflow/requirements.txt
            .github/workflows/ci.yml
      - run: python -m pip install 'specify-cli @ git+https://github.com/github/spec-kit.git@0282d03eb6fc3091b3deaa3a855d4030dc40cd6c'
      - run: python extensions/scripts/smoke_memory_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: memory-installation-${{ matrix.os }}
          retention-days: 7
          path: dist/memory-install-tests/
          if-no-files-found: ignore

  project-init:
    needs: changes
    if: needs.changes.outputs.install_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'homek8-general' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # On Windows the smoke builds its fake gh.exe from pip's launcher, which this interpreter has.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: extensions/workflow/requirements.txt
      - run: python -m pip install -r extensions/workflow/requirements.txt
      - run: python extensions/scripts/smoke_project_init.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: project-init-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/project-init-tests/*/result.json
            dist/project-init-tests/*/execution.log
          if-no-files-found: ignore

  dryrun:
    needs: changes
    if: needs.changes.outputs.install_smoke == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'homek8-general' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: project-sync degrades gracefully without config/gh
        run: |
          # No config.json + no gh scope -> must exit 0 with a logged skip, never throw.
          python3 extensions/project/scripts/project_sync.py --phase open --dry-run --json
