name: vendor-update

# Daily (and on demand): if samykabu/sanduq-skills has a newer bundle release than vendor.lock.json,
# vendor it into the extensions, pin the marketplace entry to that release, and open a pull request.
# sanduq-skills is public, so this needs no cross-repository token.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-update
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch sanduq-skills releases
        run: git clone --quiet --filter=blob:none https://github.com/samykabu/sanduq-skills.git "$RUNNER_TEMP/skills"
      - name: Vendor newer releases
        id: update
        run: |
          changed=$(python3 extensions/scripts/vendor.py update --source "$RUNNER_TEMP/skills")
          echo "$changed"
          case "$changed" in
            "every bundle is at its newest release") echo "tags=" >> "$GITHUB_OUTPUT" ;;
            *) echo "tags=$changed" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check the vendored tree and documentation
        if: steps.update.outputs.tags != ''
        run: |
          python3 -m pip install --quiet pyyaml
          python3 extensions/scripts/vendor.py check
          python3 extensions/scripts/check_docs.py
      - name: Open pull request
        if: steps.update.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.update.outputs.tags }}
        run: |
          branch="vendor/$(echo "$TAGS" | tr ' ' '+')"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request branch for $TAGS already exists."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(vendor): $TAGS from sanduq-skills"
          git push origin "$branch"
          gh pr create --title "Vendor $TAGS from sanduq-skills" --body "Vendors $TAGS from samykabu/sanduq-skills and pins the marketplace entries to those releases. Extensions that ship the vendored files need a patch release recorded in extensions/pending-releases.json before merging. Pull requests opened by this workflow do not start CI on their own; push an empty commit or re-run CI from the Actions tab."
