      <text x="520" y="144" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Noto Sans Arabic', sans-serif" text-anchor="middle">Specify</text>
      <text x="520" y="164" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">issue → branch → spec.md</text>

