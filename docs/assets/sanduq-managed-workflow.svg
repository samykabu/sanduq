      <rect x="388" y="96" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="388" y="96" width="264" height="88" rx="6" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <rect x="396" y="104" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
