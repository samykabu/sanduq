<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg">
      <defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f6078"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f8fc"/>

      <!-- ============ ARROWS (before boxes) ============ -->
      <line x1="312" y1="140" x2="388" y2="140" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="652" y1="140" x2="728" y2="140" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="312" y1="308" x2="388" y2="308" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="652" y1="308" x2="728" y2="308" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="312" y1="476" x2="388" y2="476" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="652" y1="476" x2="728" y2="476" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- row 1 -> row 2, through the empty gutter -->
      <path d="M 860,184 V 216 Q 860,224 852,224 H 188 Q 180,224 180,232 V 264" fill="none" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="464" y="204" width="112" height="12" rx="2" fill="#f6f8fc"/>
      <text x="520" y="213" fill="#6b7a90" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVED ANSWERS ONLY</text>

      <!-- row 2 -> row 3, through the empty gutter -->
      <path d="M 860,352 V 384 Q 860,392 852,392 H 188 Q 180,392 180,400 V 432" fill="none" stroke="#4f6078" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="472" y="372" width="96" height="12" rx="2" fill="#f6f8fc"/>
      <text x="520" y="381" fill="#6b7a90" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle" letter-spacing="0.06em">EXACTLY ONE EXECUTOR</text>

      <!-- ============ NODES ============ -->
      <!-- 1 Scope (FOCAL) -->
      <rect x="48" y="96" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="48" y="96" width="264" height="88" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="1"/>
      <rect x="56" y="104" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
