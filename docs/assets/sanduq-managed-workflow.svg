      <rect x="48" y="264" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="48" y="264" width="264" height="88" rx="6" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <rect x="56" y="272" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
