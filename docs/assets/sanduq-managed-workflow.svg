      <text x="520" y="480" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Noto Sans Arabic', sans-serif" text-anchor="middle">Verify and review</text>
      <text x="520" y="500" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">selected docs refreshed here</text>

      <!-- 9 Finalize (FOCAL) -->
      <rect x="728" y="432" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="728" y="432" width="264" height="88" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="1"/>
      <rect x="736" y="440" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
      <text x="760" y="449" fill="rgba(21,35,60,0.80)" font-size="7" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY</text>
      <text x="860" y="480" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Noto Sans Arabic', sans-serif" text-anchor="middle">Finalize, into one pull request</text>
      <text x="860" y="500" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">inline visuals, load-verified</text>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="560" x2="1008" y2="560" stroke="rgba(21,35,60,0.10)" stroke-width="0.8"/>
      <text x="32" y="580" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="570" width="14" height="12" rx="2" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <text x="134" y="580" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" letter-spacing="0.06em">ALWAYS RUNS</text>

      <rect x="272" y="570" width="14" height="12" rx="2" fill="rgba(21,35,60,0.02)" stroke="rgba(21,35,60,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="294" y="580" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" letter-spacing="0.06em">ONLY IF SELECTED AT INIT</text>

      <rect x="528" y="570" width="14" height="12" rx="2" fill="rgba(37,99,235,0.09)" stroke="#2563eb" stroke-width="1"/>
      <text x="550" y="580" fill="#4f6078" font-size="8" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" letter-spacing="0.06em">PIPELINE START AND END · AN "ENTRY" TAG MARKS A DAILY ENTRY POINT; CONTINUE RE-ENTERS AT THE EARLIEST UNFINISHED STAGE</text>
