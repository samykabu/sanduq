      <text x="520" y="332" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">runs only if init enabled it</text>

      <!-- 6 Analyze, then Tasks to Issues -->
      <rect x="728" y="264" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="728" y="264" width="264" height="88" rx="6" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <rect x="736" y="272" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
      <text x="754" y="281" fill="rgba(21,35,60,0.80)" font-size="7" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
      <text x="860" y="312" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Noto Sans Arabic', sans-serif" text-anchor="middle">Analyze, then Tasks to Issues</text>
      <text x="860" y="332" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">one native sub-issue per task</text>

      <!-- 7 Execute -->
      <rect x="48" y="432" width="264" height="88" rx="6" fill="#f6f8fc"/>
      <rect x="48" y="432" width="264" height="88" rx="6" fill="#ffffff" stroke="#15233c" stroke-width="1"/>
      <rect x="56" y="440" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,35,60,0.40)" stroke-width="0.8"/>
      <text x="80" y="449" fill="rgba(21,35,60,0.80)" font-size="7" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle" letter-spacing="0.08em">ONE OF</text>
      <text x="180" y="480" fill="#15233c" font-size="12" font-weight="600" font-family="'IBM Plex Sans', 'Noto Sans Arabic', sans-serif" text-anchor="middle">Execute</text>
      <text x="180" y="500" fill="#4f6078" font-size="9" font-family="'IBM Plex Mono', 'Noto Sans Arabic', monospace" text-anchor="middle">SuperSpec or core implement</text>

