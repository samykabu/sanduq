<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc"><title id="title">QA readiness and evidence</title><desc id="desc">Assure Init chooses required integrated hooks or manual operation. Analyze improves tester readiness before implementation; real project checks provide test evidence; Document writes the walkthrough afterward. Workflow can select or omit this lane.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="600" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER / PROJECT</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">HOOK / DISPATCHER</text><line x1="320" y1="50" x2="320" y2="580" stroke="#c7d2e2"/><path d="M170 134 V143.0 Q170 151.0 178 151.0 H462 Q470 151.0 470 159.0 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 230 V239.0 Q470 247.0 462 247.0 H178 Q170 247.0 170 255.0 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 326 V335.0 Q170 343.0 178 343.0 H462 Q470 343.0 470 351.0 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="50" y="72" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">assure.init</text><text class="sub" x="170" y="118" text-anchor="middle">required / manual policy</text><rect x="350" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="193" font-size="15" font-weight="600" text-anchor="middle">assure.analyze</text><text class="sub" x="470" y="214" text-anchor="middle">readiness + missing tasks</text><rect x="50" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="289" font-size="15" font-weight="600" text-anchor="middle">Implement and run tests</text><text class="sub" x="170" y="310" text-anchor="middle">actual project test commands</text><rect x="350" y="360" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="470" y="385" font-size="15" font-weight="600" text-anchor="middle">assure.document</text><text class="sub" x="470" y="406" text-anchor="middle">steps + observed evidence</text><rect x="350" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="481" font-size="15" font-weight="600" text-anchor="middle">Check freshness</text><text class="sub" x="470" y="502" text-anchor="middle">changed code needs update</text></svg>
