<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 748" role="img" aria-labelledby="lifecycle-overlay-title lifecycle-overlay-desc"><title id="lifecycle-overlay-title">Hooks on the Spec Kit lifecycle</title><desc id="lifecycle-overlay-desc">Each Spec Kit phase with the extension hooks that run before and after it, as the manifests declare them. Specify, Plan and Analyze have mandatory guard and memory hooks; Tasks and Implement carry the optional QA, manual, board-sync and PR hooks; Clarify has none. After merge and at release you run the Memory archive and User Manual release commands yourself.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', 'Noto Sans Arabic', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--muted)}.e{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.mask{fill:var(--paper)}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}.chip{fill:var(--paper2);stroke:var(--ink);stroke-width:1.25}.chip.opt{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.chip.cmd{fill:none;stroke:var(--soft);stroke-width:1;stroke-dasharray:1 3}.cmdph{stroke-dasharray:1 3}.ct{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--ink)}@media (prefers-reduced-motion: no-preference){.s{animation:rv 480ms cubic-bezier(.2,.8,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.s1{animation-delay:0ms}.s2{animation-delay:560ms}.s3{animation-delay:1120ms}.s4{animation-delay:1680ms}.s5{animation-delay:2240ms}.s6{animation-delay:2800ms}.s7{animation-delay:3360ms}.s8{animation-delay:3920ms}.ph-box{animation:lit 1200ms ease-out both}@keyframes lit{0%,45%{stroke:var(--accent);fill:var(--tint)}100%{stroke:var(--rule);fill:var(--paper2)}}.s2 .ph-box{animation-delay:560ms}.s3 .ph-box{animation-delay:1120ms}.s4 .ph-box{animation-delay:1680ms}.s5 .ph-box{animation-delay:2240ms}.s6 .ph-box{animation-delay:2800ms}.s7 .ph-box{animation-delay:3360ms}.s8 .ph-box{animation-delay:3920ms}}</style><rect class="bg" width="1000" height="748"/><g class="s s1"><text class="e" x="40" y="36" font-size="12">BEFORE THE PHASE</text><text class="e" x="388" y="36" font-size="12" text-anchor="middle">SPEC KIT PHASE</text><text class="e" x="520" y="36" font-size="12">AFTER THE PHASE</text></g><g class="s s2"><rect x="40" y="56.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="75.0" font-size="13" font-weight="600">scope.guard</text><rect x="40" y="92.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="111.0" font-size="13" font-weight="600">memory.session</text><path class="c" d="M252 88 H298" marker-end="url(#ar)"/><path class="c" d="M476 88 H518" marker-end="url(#ar)"/><rect x="520" y="56.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="532" y="75.0" font-size="13" font-weight="600">scope.bind</text><rect x="748" y="56.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="760" y="75.0" font-size="13">project.sync</text><rect x="520" y="92.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="532" y="111.0" font-size="13" font-weight="600">scope.after-specify</text><g class="ph"><rect x="300" y="56" width="176" height="64" rx="6" class="box ph-box"/><text x="388" y="84" text-anchor="middle" font-size="16" font-weight="600">Specify</text><text class="m" x="388" y="103" text-anchor="middle" font-size="12">speckit.specify</text></g></g><g class="s s3"><path class="c" d="M388 120 V146" marker-end="url(#ar)"/><text class="m" x="520" y="178" font-size="13">no hooks</text><g class="ph"><rect x="300" y="148" width="176" height="52" rx="6" class="box ph-box"/><text x="388" y="170" text-anchor="middle" font-size="16" font-weight="600">Clarify</text><text class="m" x="388" y="189" text-anchor="middle" font-size="12">speckit.clarify</text></g></g><g class="s s4"><path class="c" d="M388 200 V226" marker-end="url(#ar)"/><rect x="40" y="240.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="259.0" font-size="13" font-weight="600">scope.plan-guard</text><path class="c" d="M252 254 H298" marker-end="url(#ar)"/><path class="c" d="M476 254 H518" marker-end="url(#ar)"/><rect x="520" y="240.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="259.0" font-size="13">project.sync</text><g class="ph"><rect x="300" y="228" width="176" height="52" rx="6" class="box ph-box"/><text x="388" y="250" text-anchor="middle" font-size="16" font-weight="600">Plan</text><text class="m" x="388" y="269" text-anchor="middle" font-size="12">speckit.plan</text></g></g><g class="s s5"><path class="c" d="M388 280 V306" marker-end="url(#ar)"/><path class="c" d="M476 340 H518" marker-end="url(#ar)"/><rect x="520" y="308.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="327.0" font-size="13">assure.analyze</text><rect x="748" y="308.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="760" y="327.0" font-size="13">project.sync</text><rect x="520" y="344.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="363.0" font-size="13">user-manual.analyze</text><g class="ph"><rect x="300" y="308" width="176" height="64" rx="6" class="box ph-box"/><text x="388" y="336" text-anchor="middle" font-size="16" font-weight="600">Tasks</text><text class="m" x="388" y="355" text-anchor="middle" font-size="12">speckit.tasks</text></g></g><g class="s s6"><path class="c" d="M388 372 V398" marker-end="url(#ar)"/><rect x="40" y="412.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="431.0" font-size="13" font-weight="600">memory.impact</text><path class="c" d="M252 426 H298" marker-end="url(#ar)"/><path class="c" d="M476 426 H518" marker-end="url(#ar)"/><rect x="520" y="412.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="431.0" font-size="13">project.sync</text><g class="ph"><rect x="300" y="400" width="176" height="52" rx="6" class="box ph-box"/><text x="388" y="422" text-anchor="middle" font-size="16" font-weight="600">Analyze</text><text class="m" x="388" y="441" text-anchor="middle" font-size="12">speckit.analyze</text></g></g><g class="s s7"><path class="c" d="M388 452 V478" marker-end="url(#ar)"/><rect x="40" y="498.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="52" y="517.0" font-size="13">assure.analyze</text><rect x="40" y="534.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="52" y="553.0" font-size="13">project.sync</text><path class="c" d="M252 530 H298" marker-end="url(#ar)"/><path class="c" d="M476 530 H518" marker-end="url(#ar)"/><rect x="520" y="480.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="499.0" font-size="13">assure.document</text><rect x="748" y="480.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="760" y="499.0" font-size="13" font-weight="600">memory.prepare</text><rect x="520" y="516.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="535.0" font-size="13">pr.generate</text><rect x="748" y="516.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="760" y="535.0" font-size="13">project.sync</text><rect x="520" y="552.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="532" y="571.0" font-size="13">user-manual.update</text><rect x="748" y="552.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="760" y="571.0" font-size="13" font-weight="600">scope.reconcile</text><g class="ph"><rect x="300" y="480" width="176" height="100" rx="6" class="box ph-box"/><text x="388" y="526" text-anchor="middle" font-size="16" font-weight="600">Implement</text><text class="m" x="388" y="545" text-anchor="middle" font-size="12">speckit.implement</text></g></g><g class="s s8"><path class="c" d="M388 580 V606" marker-end="url(#ar)"/><path class="c" d="M476 634 H518" marker-end="url(#ar)"/><rect x="520" y="620.0" width="212" height="28" rx="4" class="chip cmd"/><text class="m" x="532" y="639.0" font-size="13">memory.run</text><rect x="748" y="620.0" width="212" height="28" rx="4" class="chip cmd"/><text class="m" x="760" y="639.0" font-size="13">user-manual.release</text><g class="ph"><rect x="300" y="608" width="176" height="52" rx="6" class="box ph-box cmdph"/><text x="388" y="630" text-anchor="middle" font-size="16" font-weight="600">After merge, release</text><text class="m" x="388" y="649" text-anchor="middle" font-size="12">you run these</text></g></g><g class="s s8"><line x1="24" y1="684" x2="976" y2="684" class="zone"/><rect x="40" y="702" width="176" height="28" rx="4" class="chip"/><text class="ct" x="52" y="721" font-size="13" font-weight="600">mandatory: runs</text><rect x="232" y="702" width="192" height="28" rx="4" class="chip opt"/><text class="m" x="244" y="721" font-size="13">optional: asks first</text><rect x="440" y="702" width="196" height="28" rx="4" class="chip cmd"/><text class="m" x="452" y="721" font-size="13">command, not a hook</text><text class="m" x="652" y="721" font-size="12">Names drop the speckit. prefix.</text></g></svg>
