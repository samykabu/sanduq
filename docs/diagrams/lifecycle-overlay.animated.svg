<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 876" role="img" aria-labelledby="lifecycle-overlay-title lifecycle-overlay-desc"><title id="lifecycle-overlay-title">Hooks on the Spec Kit lifecycle</title><desc id="lifecycle-overlay-desc">Each Spec Kit phase with the extension hooks that run before and after it, as the manifests declare them. Specify, Plan and Analyze have mandatory guard and memory hooks; Tasks and Implement carry the optional QA, manual, progress, board-sync and PR hooks; Clarify has none. Two loops go back: when Analyze finds a gap you fix the spec, plan or tasks and run Analyze again, and when PR review feedback or a failed check needs a fix, running Implement again makes the after-implement hooks refresh the documentation; a fix made outside Implement does not run them. After merge and at release you run the Memory archive and User Manual release commands yourself.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', 'Noto Sans Arabic', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--muted)}.e{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.mask{fill:var(--paper)}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}.lb{fill:var(--muted)}.chip{fill:var(--paper2);stroke:var(--ink);stroke-width:1.25}.chip.opt{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.chip.cmd{fill:none;stroke:var(--soft);stroke-width:1;stroke-dasharray:1 3}.cmdph{stroke-dasharray:1 3}.ct{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--ink)}@media (prefers-reduced-motion: no-preference){.s{animation:rv 480ms cubic-bezier(.2,.8,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.s1{animation-delay:0ms}.s2{animation-delay:560ms}.s3{animation-delay:1120ms}.s4{animation-delay:1680ms}.s5{animation-delay:2240ms}.s6{animation-delay:2800ms}.s7{animation-delay:3360ms}.s8{animation-delay:3920ms}.ph-box{animation:lit 1200ms ease-out both}@keyframes lit{0%,45%{stroke:var(--accent);fill:var(--tint)}100%{stroke:var(--rule);fill:var(--paper2)}}.s2 .ph-box{animation-delay:560ms}.s3 .ph-box{animation-delay:1120ms}.s4 .ph-box{animation-delay:1680ms}.s5 .ph-box{animation-delay:2240ms}.s6 .ph-box{animation-delay:2800ms}.s7 .ph-box{animation-delay:3360ms}.s8 .ph-box{animation-delay:3920ms}}</style><rect class="bg" width="1090" height="876"/><g class="s s1"><text class="e" x="40" y="36" font-size="12">BEFORE THE PHASE</text><text class="e" x="372" y="36" font-size="12" text-anchor="middle">SPEC KIT PHASE</text><text class="e" x="496" y="36" font-size="12">AFTER THE PHASE</text></g><g class="s s2"><rect x="40" y="64.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="83.0" font-size="13" font-weight="600">workflow.scope-guard</text><rect x="40" y="100.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="119.0" font-size="13" font-weight="600">memory.session</text><path class="c" d="M252 96 H282" marker-end="url(#ar)"/><path class="c" d="M460 96 H494" marker-end="url(#ar)"/><rect x="496" y="64.0" width="232" height="28" rx="4" class="chip"/><text class="ct" x="508" y="83.0" font-size="13" font-weight="600">workflow.scope-bind</text><rect x="740" y="64.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="752" y="83.0" font-size="13">project.sync</text><rect x="496" y="100.0" width="232" height="28" rx="4" class="chip"/><text class="ct" x="508" y="119.0" font-size="13" font-weight="600">workflow.scope-after-specify</text><g class="ph"><rect x="284" y="64" width="176" height="64" rx="6" class="box ph-box"/><text x="372" y="92" text-anchor="middle" font-size="16" font-weight="600">Specify</text><text class="m" x="372" y="111" text-anchor="middle" font-size="12">speckit.specify</text></g></g><g class="s s3"><path class="c" d="M372 128 V166" marker-end="url(#ar)"/><text class="m" x="496" y="198" font-size="13">no hooks</text><g class="ph"><rect x="284" y="168" width="176" height="52" rx="6" class="box ph-box"/><text x="372" y="190" text-anchor="middle" font-size="16" font-weight="600">Clarify</text><text class="m" x="372" y="209" text-anchor="middle" font-size="12">speckit.clarify</text></g></g><g class="s s4"><path class="c" d="M372 220 V258" marker-end="url(#ar)"/><rect x="40" y="272.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="291.0" font-size="13" font-weight="600">workflow.scope-plan-guard</text><path class="c" d="M252 286 H282" marker-end="url(#ar)"/><path class="c" d="M460 286 H494" marker-end="url(#ar)"/><rect x="496" y="272.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="291.0" font-size="13">project.sync</text><g class="ph"><rect x="284" y="260" width="176" height="52" rx="6" class="box ph-box"/><text x="372" y="282" text-anchor="middle" font-size="16" font-weight="600">Plan</text><text class="m" x="372" y="301" text-anchor="middle" font-size="12">speckit.plan</text></g></g><g class="s s5"><path class="c" d="M372 312 V350" marker-end="url(#ar)"/><path class="c" d="M460 384 H494" marker-end="url(#ar)"/><rect x="496" y="352.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="371.0" font-size="13">assure.analyze</text><rect x="740" y="352.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="752" y="371.0" font-size="13">progress.init</text><rect x="496" y="388.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="407.0" font-size="13">project.sync</text><rect x="740" y="388.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="752" y="407.0" font-size="13">user-manual.analyze</text><g class="ph"><rect x="284" y="352" width="176" height="64" rx="6" class="box ph-box"/><text x="372" y="380" text-anchor="middle" font-size="16" font-weight="600">Tasks</text><text class="m" x="372" y="399" text-anchor="middle" font-size="12">speckit.tasks</text></g></g><g class="s s6"><path class="c" d="M372 416 V454" marker-end="url(#ar)"/><rect x="40" y="468.0" width="212" height="28" rx="4" class="chip"/><text class="ct" x="52" y="487.0" font-size="13" font-weight="600">memory.impact</text><path class="c" d="M252 482 H282" marker-end="url(#ar)"/><path class="c" d="M460 482 H494" marker-end="url(#ar)"/><rect x="496" y="468.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="487.0" font-size="13">project.sync</text><g class="ph"><rect x="284" y="456" width="176" height="52" rx="6" class="box ph-box"/><text x="372" y="478" text-anchor="middle" font-size="16" font-weight="600">Analyze</text><text class="m" x="372" y="497" text-anchor="middle" font-size="12">speckit.analyze</text></g></g><g class="s s7"><path class="c" d="M372 508 V546" marker-end="url(#ar)"/><rect x="40" y="584.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="52" y="603.0" font-size="13">assure.analyze</text><rect x="40" y="620.0" width="212" height="28" rx="4" class="chip opt"/><text class="m" x="52" y="639.0" font-size="13">project.sync</text><path class="c" d="M252 616 H282" marker-end="url(#ar)"/><path class="c" d="M460 616 H494" marker-end="url(#ar)"/><rect x="496" y="548.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="567.0" font-size="13">assure.document</text><rect x="740" y="548.0" width="232" height="28" rx="4" class="chip"/><text class="ct" x="752" y="567.0" font-size="13" font-weight="600">memory.prepare</text><rect x="496" y="584.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="603.0" font-size="13">pr.generate</text><rect x="740" y="584.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="752" y="603.0" font-size="13">progress.refresh</text><rect x="496" y="620.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="508" y="639.0" font-size="13">project.sync</text><rect x="740" y="620.0" width="232" height="28" rx="4" class="chip opt"/><text class="m" x="752" y="639.0" font-size="13">user-manual.update</text><rect x="496" y="656.0" width="232" height="28" rx="4" class="chip"/><text class="ct" x="508" y="675.0" font-size="13" font-weight="600">workflow.scope-reconcile</text><g class="ph"><rect x="284" y="548" width="176" height="136" rx="6" class="box ph-box"/><text x="372" y="612" text-anchor="middle" font-size="16" font-weight="600">Implement</text><text class="m" x="372" y="631" text-anchor="middle" font-size="12">speckit.implement</text></g></g><g class="s s8"><path class="c" d="M372 684 V722" marker-end="url(#ar)"/><path class="c" d="M460 750 H494" marker-end="url(#ar)"/><rect x="496" y="736.0" width="232" height="28" rx="4" class="chip cmd"/><text class="m" x="508" y="755.0" font-size="13">memory.run</text><rect x="740" y="736.0" width="232" height="28" rx="4" class="chip cmd"/><text class="m" x="752" y="755.0" font-size="13">user-manual.release</text><g class="ph"><rect x="284" y="724" width="176" height="52" rx="6" class="box ph-box cmdph"/><text x="372" y="746" text-anchor="middle" font-size="16" font-weight="600">After merge, release</text><text class="m" x="372" y="765" text-anchor="middle" font-size="12">you run these</text></g></g><g class="s s8"><path class="lk" d="M430 508 V522 H1010 V240 H446 V258" marker-end="url(#arl)"/><text class="lb" x="496" y="234" font-size="12">Analyze found a gap: fix the spec, plan or tasks, then run Analyze again</text><path class="lk" d="M430 684 V704 H1050 V534 H446 V546" marker-end="url(#arl)"/><text class="lb" x="496" y="698" font-size="12">Review feedback or a failed check: fix, then run Implement again so these hooks refresh</text></g><g class="s s8"><line x1="24" y1="812" x2="976" y2="812" class="zone"/><rect x="40" y="830" width="176" height="28" rx="4" class="chip"/><text class="ct" x="52" y="849" font-size="13" font-weight="600">mandatory: runs</text><rect x="232" y="830" width="192" height="28" rx="4" class="chip opt"/><text class="m" x="244" y="849" font-size="13">optional: asks first</text><rect x="440" y="830" width="196" height="28" rx="4" class="chip cmd"/><text class="m" x="452" y="849" font-size="13">command, not a hook</text><path class="lk" d="M656 844 H696" marker-end="url(#arl)"/><text class="m" x="706" y="849" font-size="12">loops back. Names drop the speckit. prefix.</text></g></svg>
