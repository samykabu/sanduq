<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">Optional delivery lanes</title><desc id="desc">Workflow Init selects QA and User Manual independently. Each enabled lane adds analysis before implementation and documentation after verification; disabled lanes are skipped. A single selected core or SuperSpec executor still owns implementation.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-size:14px;fill:#4f6078}</style><rect width="1000" height="800" fill="#f6f8fc"/><path d="M500 114 V141" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M630 195 H752 Q760 195 760 203 V266" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M500 245 V252 Q500 260 492 260 H248 Q240 260 240 268 V270" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M760 324 V347 Q760 355 752 355 H512 Q504 355 504 363 V383" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M240 324 V367 Q240 375 248 375 H488 Q496 375 496 383 V383" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M630 445 H752 Q760 445 760 453 V516" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M500 495 V502 Q500 510 492 510 H248 Q240 510 240 518 V520" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M760 574 V597 Q760 605 752 605 H512 Q504 605 504 613 V673" fill="none" str