<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 888" role="img" aria-labelledby="title desc"><title id="title">Managed delivery</title><desc id="desc">The user starts Scope and responds to clarification when needed. The dispatcher owns ordered stages and the selected executor. QA and manual lanes run only when enabled. Finalize is a user invocation that authorizes the PR handoff.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="888" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">DISPATCHER</text><line x1="320" y1="50" x2="320" y2="868" stroke="#c7d2e2"/><path d="M170 134 V143.0 Q170 151.0 178 151.0 H462 Q470 151.0 470 159.0 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 230 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 326 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 518 V548" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 614 V623.0 Q470 631.0 462 631.0 H178 Q170 631.0 170 639.0 V644" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 710 V719.0 Q170 727.0 178 727.0 H462 Q470 727.0 470 735.0 V740" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="50" y="72" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">workflow.scope 412</text><text class="sub" x="170" y="118" text-anchor="middle">manual · explicit issue</text><rect x="350" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="193" font-size="15" font-weight="600" text-anchor="middle">Scope → Specify → Clarify</text><text class="sub" x="470" y="214" text-anchor="middle">automatic · questions pause</text><rect x="350" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="289" font-size="15" font-weight="600" text-anchor="middle">Plan → selected Tasks</text><text class="sub" x="470" y="310" text-anchor="middle">automatic · one generator</text><rect x="350" y="360" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="385" font-size="15" font-weight="600" text-anchor="middle">Analysis → Implement</text><text class="sub" x="470" y="406" text-anchor="middle">QA/manual if selected</text><rect x="350" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="481" font-size="15" font-weight="600" text-anchor="middle">Verify → Review</text><text class="sub" x="470" y="502" text-anchor="middle">record actual check evidence</text><rect x="350" y="552" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="577" font-size="15" font-weight="600" text-anchor="middle">QA doc / Manual → Ready</text><text class="sub" x="470" y="598" text-anchor="middle">selected docs + fresh gates</text><rect x="50" y="648" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="673" font-size="15" font-weight="600" text-anchor="middle">workflow.finalize</text><text class="sub" x="170" y="694" text-anchor="middle">manual · PR authorization</text><rect x="350" y="744" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="769" font-size="15" font-weight="600" text-anchor="middle">PR handoff</text><text class="sub" x="470" y="790" text-anchor="middle">blocked if evidence stale</text></svg>
