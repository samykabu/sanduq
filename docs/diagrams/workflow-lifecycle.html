<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From scope to merge</title><style>body{margin:0;background:#f6f8fc}main{max-width:1080px;margin:auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 496" role="img" aria-labelledby="title description"><title id="title">From scope to merge</title><desc id="description">Eight grouped stages show the Sanduq lifecycle, including optional QA and manual work, implementation, verification, review, readiness, pull request and merge.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Serif:ital,wght@0,400;1,400&amp;family=Noto+Naskh+Arabic:wght@400;500;600&amp;family=Noto+Sans+Arabic:wght@400;500;600&amp;display=swap");text{font-family:'IBM Plex Sans','Noto Sans Arabic',system-ui,sans-serif;fill:#15233c}.title{font-family:'IBM Plex Serif','Noto Naskh Arabic',serif;font-size:28px}.name{font-size:16px;font-weight:600}.sub{font-size:13px;fill:#4f6078}.note{font-size:14px;fill:#4f6078}.step{fill:#fff;stroke:#c7d2e2;stroke-width:1.5}.focus{fill:rgba(37,99,235,0.09);stroke:#2563eb;stroke-width:1.5}.edge{fill:none;stroke:#4f6078;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f6078"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker></defs><rect width="1080" height="496" fill="#f6f8fc"/><text class="title" x="40" y="48">From scope to merge</text><text class="note" x="40" y="80">Each stage records evidence before the dispatcher advances.</text><path class="edge" d="M 264,164 H 296"/><path class="edge" d="M 520,164 H 552"/><path class="edge" d="M 776,164 H 808"/><path class="edge" d="M 920,208 V 272"/><path class="edge" d="M 808,316 H 776"/><path class="edge" d="M 552,316 H 520"/><path class="edge" d="M 296,316 H 264"/><rect class="step" x="40" y="120" width="224" height="88" rx="8"/><text class="name" x="56" y="148">1. Agree on scope</text><text class="sub" x="56" y="170">scope · specify · clarify</text><rect class="step" x="296" y="120" width="224" height="88" rx="8"/><text class="name" x="312" y="148">2. Plan the work</text><text class="sub" x="312" y="170">plan · tasks</text><rect class="step" x="552" y="120" width="224" height="88" rx="8"/><text class="name" x="568" y="148">3. Check the plan</text><text class="sub" x="568" y="170">QA / manual analysis*</text><text class="sub" x="568" y="188">analyze · taskstoissues</text><rect class="focus" x="808" y="120" width="224" height="88" rx="8"/><text class="name" x="824" y="148">4. Implement</text><text class="sub" x="824" y="170">orchestrator + workers</text><text class="sub" x="824" y="188">live report · phase pushes</text><rect class="step" x="808" y="272" width="224" height="88" rx="8"/><text class="name" x="824" y="300">5. Verify and review</text><text class="sub" x="824" y="322">verify · review</text><rect class="step" x="552" y="272" width="224" height="88" rx="8"/><text class="name" x="568" y="300">6. Update the docs</text><text class="sub" x="568" y="322">QA documentation*</text><text class="sub" x="568" y="340">manual update*</text><rect class="step" x="296" y="272" width="224" height="88" rx="8"/><text class="name" x="312" y="300">7. Prepare the PR</text><text class="sub" x="312" y="322">ready · pr</text><text class="sub" x="312" y="340">check evidence freshness</text><rect class="focus" x="40" y="272" width="224" height="88" rx="8"/><text class="name" x="56" y="300">8. Finish delivery</text><text class="sub" x="56" y="322">resolve CI and review</text><text class="sub" x="56" y="340">merge · close the report</text><path d="M 40,404 H 1032" stroke="#c7d2e2"/><text class="note" x="40" y="436">* QA and manual stages run when selected by project policy.</text><text class="note" x="40" y="460">Failed checks return work to the responsible stage. Merge requires passing CI and the required approvals.</text></svg></main></body></html>
