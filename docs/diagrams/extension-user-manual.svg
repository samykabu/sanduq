<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 696" role="img" aria-labelledby="title desc"><title id="title">Manual maintenance</title><desc id="desc">Init interviews the owner and requires approval of the module map. Analyze adds documentation work. Update follows implementation and audits/builds a preview. Release needs verified application release evidence; it is not triggered by a draft feature.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="696" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">HOOK / DISPATCHER</text><line x1="320" y1="50" x2="320" y2="676" stroke="#c7d2e2"/><path d="M170 134 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 230 V232 Q170 238 176 238 H464 Q470 238 470 244 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 326 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 422 V424 Q470 430 464 430 H176 Q170 430 170 436 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 518 V520 Q170 526 176 526 H464 Q470 526 470 532 V548" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="50" y="72" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">user-manual.init</text><text class="sub" x="170" y="118" text-anchor="middle">interview + discovered modules</text><rect x="50" y="168" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="193" font-size="15" font-weight="600" text-anchor="middle">Approve module map</text><text class="sub" x="170" y="214" text-anchor="middle">Booking / Payments / Ops</text><rect x="350" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="289" font-size="15" font-weight="600" text-anchor="middle">user-manual.analyze</text><text class="sub" x="470" y="310" text-anchor="middle">before implementation</text><rect x="350" y="360" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="385" font-size="15" font-weight="600" text-anchor="middle">user-manual.update</text><text class="sub" x="470" y="406" text-anchor="middle">after implementation + audit</text><rect x="50" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="481" font-size="15" font-weight="600" text-anchor="middle">Verified app release</text><text class="sub" x="170" y="502" text-anchor="middle">e.g. synthetic v3.0.0</text><rect x="350" y="552" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="470" y="577" font-size="15" font-weight="600" text-anchor="middle">user-manual.release</text><text class="sub" x="470" y="598" text-anchor="middle">audience/language outputs</text></svg>
