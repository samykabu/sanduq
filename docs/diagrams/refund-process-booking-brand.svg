<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-labelledby="title desc"><title id="title">Refund approval process</title><desc id="desc">Synthetic booking example: an operator requests a refund; the API checks access; an authorized operator decides; Payments settles only approvals; the API records the result. Rejection ends before settlement; a failed payment remains failed until reconciled.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#526078"/></marker></defs><style>text{font-family:system-ui, sans-serif;fill:#172033}.sub{font-family:ui-monospace, monospace;fill:#526078;font-size:12px}</style><rect width="940" height="600" fill="#f7f9fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">OPERATOR</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">BOOKING API</text><line x1="320" y1="50" x2="320" y2="580" stroke="#cbd4e2"/><text x="770" y="32" text-anchor="middle" font-size="13" font-weight="600">PAYMENTS</text><line x1="620" y1="50" x2="620" y2="580" stroke="#cbd4e2"/><path d="M170 134 V143.0 Q170 151.0 178 151.0 H462 Q470 151.0 470 159.0 V164" fill="none" stroke="#526078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 230 V239.0 Q470 247.0 462 247.0 H178 Q170 247.0 170 255.0 V260" fill="none" stroke="#526078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 326 V335.0 Q170 343.0 178 343.0 H762 Q770 343.0 770 351.0 V356" fill="none" stroke="#526078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="395.0" y="317.0" width="150" height="19" fill="#f7f9fc"/><text class="sub" x="470.0" y="331.0" text-anchor="middle">approved only</text><path d="M770 422 V431.0 Q770 439.0 762 439.0 H478 Q470 439.0 470 447.0 V452" fill="none" stroke="#526078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="50" y="72" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd4e2"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">Request refund</text><text class="sub" x="170" y="118" text-anchor="middle">Booking · request + reason</text><rect x="350" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd4e2"/><text x="470" y="193" font-size="15" font-weight="600" text-anchor="middle">Check permission</text><text class="sub" x="470" y="214" text-anchor="middle">API · identity + booking</text><rect x="50" y="264" width="240" height="62" rx="6" fill="rgba(135,93,9,0.09)" stroke="#875d09"/><text x="170" y="289" font-size="15" font-weight="600" text-anchor="middle">Approve or reject</text><text class="sub" x="170" y="310" text-anchor="middle">Operations · decision</text><rect x="650" y="360" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd4e2"/><text x="770" y="385" font-size="15" font-weight="600" text-anchor="middle">Settle approved refund</text><text class="sub" x="770" y="406" text-anchor="middle">Payments · idempotent call</text><rect x="350" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#cbd4e2"/><text x="470" y="481" font-size="15" font-weight="600" text-anchor="middle">Record final outcome</text><text class="sub" x="470" y="502" text-anchor="middle">API · settled / failed</text></svg>
