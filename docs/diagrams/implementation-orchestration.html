<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How implementation agents work</title><style>body{margin:0;background:#f6f8fc}main{max-width:1080px;margin:auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1012" role="img" aria-labelledby="title description"><title id="title">How implementation agents work</title><desc id="description">A dedicated orchestrator dispatches independent workers, integrates their results, verifies each phase, commits and pushes, repeats for remaining work, then tracks review, CI and merge in a live report.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Serif:ital,wght@0,400;1,400&amp;family=Noto+Naskh+Arabic:wght@400;500;600&amp;family=Noto+Sans+Arabic:wght@400;500;600&amp;display=swap");text{font-family:'IBM Plex Sans','Noto Sans Arabic',system-ui,sans-serif;fill:#15233c}.title{font-family:'IBM Plex Serif','Noto Naskh Arabic',serif;font-size:28px}.name{font-size:16px;font-weight:600}.sub{font-size:13px;fill:#4f6078}.note{font-size:14px;fill:#4f6078}.step{fill:#fff;stroke:#c7d2e2;stroke-width:1.5}.focus{fill:rgba(37,99,235,0.09);stroke:#2563eb;stroke-width:1.5}.edge{fill:none;stroke:#4f6078;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f6078"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker></defs><rect width="1080" height="1012" fill="#f6f8fc"/><text class="title" x="40" y="48">How implementation agents work</text><text class="note" x="40" y="80">The orchestrator stays responsible for every phase and the progress report.</text><path class="edge" d="M 540,192 V 224"/><path class="edge" d="M 440,312 V 336 Q 440,344 432,344 H 224 Q 216,344 216,352 V 376"/><path class="edge" d="M 540,312 V 376"/><path class="edge" d="M 640,312 V 336 Q 640,344 648,344 H 856 Q 864,344 864,352 V 376"/><path class="edge" d="M 216,464 V 496 Q 216,504 224,504 H 432 Q 440,504 440,512 V 536"/><path class="edge" d="M 540,464 V 536"/><path class="edge" d="M 864,464 V 496 Q 864,504 856,504 H 648 Q 640,504 640,512 V 536"/><path class="edge" d="M 540,624 V 668"/><path class="edge" d="M 540,756 V 800"/><path class="edge" d="M 740,712 H 1000 Q 1008,712 1008,704 V 260 Q 1008,252 1000,252 H 740" stroke-dasharray="5 4"/><rect class="step" x="340" y="104" width="400" height="88" rx="8"/><text class="name" x="356" y="132">Start implementation</text><text class="sub" x="356" y="154">open the HTML TODO report</text><text class="sub" x="356" y="172">record phases, tasks and acceptance checks</text><rect class="focus" x="340" y="224" width="400" height="88" rx="8"/><text class="name" x="356" y="252">Create a dedicated orchestrator</text><text class="sub" x="356" y="274">check dependencies, file ownership and capacity</text><text class="sub" x="356" y="292">dispatch the largest safe batch of ready tasks</text><rect class="step" x="88" y="376" width="256" height="88" rx="8"/><text class="name" x="104" y="404">Worker A</text><text class="sub" x="104" y="426">owned files and task</text><text class="sub" x="104" y="444">test its change</text><rect class="step" x="412" y="376" width="256" height="88" rx="8"/><text class="name" x="428" y="404">Worker B</text><text class="sub" x="428" y="426">separate files and task</text><text class="sub" x="428" y="444">test its change</text><rect class="step" x="736" y="376" width="256" height="88" rx="8"/><text class="name" x="752" y="404">Worker N</text><text class="sub" x="752" y="426">use available capacity</text><text class="sub" x="752" y="444">isolate shared resources</text><rect class="step" x="340" y="536" width="400" height="88" rx="8"/><text class="name" x="356" y="564">Integrate and verify</text><text class="sub" x="356" y="586">review worker results and run phase checks</text><text class="sub" x="356" y="604">update task evidence and the live report</text><rect class="step" x="340" y="668" width="400" height="88" rx="8"/><text class="name" x="356" y="696">Commit and push the phase</text><text class="sub" x="356" y="718">one owner serializes Git writes</text><text class="sub" x="356" y="736">continue until every phase is complete</text><rect class="focus" x="340" y="800" width="400" height="88" rx="8"/><text class="name" x="356" y="828">Review, CI and merge</text><text class="sub" x="356" y="850">fix failures and satisfy required approvals</text><text class="sub" x="356" y="868">record the merged PR in the report</text><rect x="856" y="592" width="128" height="48" fill="#f6f8fc"/><text class="sub" x="864" y="612">remaining</text><text class="sub" x="864" y="632">phases</text><path d="M 40,920 H 1032" stroke="#c7d2e2"/><text class="note" x="40" y="952">Update the report after assignments, results, checks, commits, pushes, CI changes and merge.</text><text class="note" x="40" y="976">Serialize overlapping work. Show blockers and failed checks with the action needed to resume.</text></svg></main></body></html>
