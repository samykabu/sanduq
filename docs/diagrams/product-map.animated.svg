<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 748" role="img" aria-labelledby="product-map-title product-map-desc"><title id="product-map-title">What is in the box</title><desc id="product-map-desc">Eight Spec Kit extensions and three presets live in this repository. Scope requires Workflow and Illustrate; Assure, PR and User Manual require Illustrate; PR uses Assure and User Manual when they are installed; Project and Memory need no other extension. The separate sanduq-skills repository holds the portable Illustrate, User Manual and Delegate Task skills, which are copied into the Illustrate, User Manual and Workflow extensions and published as plugin bundles through the sanduq marketplace.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', 'Noto Sans Arabic', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--muted)}.e{font-family:'IBM Plex Mono', 'Noto Sans Arabic', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.mask{fill:var(--paper)}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}@media (prefers-reduced-motion: no-preference){.s{animation:rv 480ms cubic-bezier(.2,.8,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.s1{animation-delay:0ms}.s2{animation-delay:520ms}.s3{animation-delay:1040ms}.s4{animation-delay:1560ms}.s5{animation-delay:2080ms}.s6{animation-delay:2600ms}.s7{animation-delay:3120ms}.s8{animation-delay:3640ms}}</style><rect class="bg" width="1000" height="748"/><g class="s s1"><rect x="24" y="48" width="952" height="404" rx="8" class="zone"/><text class="e" x="48" y="80" font-size="12">THIS REPOSITORY · 8 SPEC KIT EXTENSIONS AND 3 PRESETS</text></g><g class="s s2"><rect x="56" y="364" width="892" height="64" rx="6" class="focal"/><text x="502" y="392" text-anchor="middle" font-size="17" font-weight="600">Illustrate</text><text class="m" x="502" y="411" text-anchor="middle" font-size="12">themed diagrams and charts · works alone · includes the Illustrate skill</text></g><g class="s s3"><path class="c" d="M154 300 V362" marker-end="url(#ar)"/><path class="c" d="M386 300 V362" marker-end="url(#ar)"/><path class="c" d="M618 300 V362" marker-end="url(#ar)"/><path class="c" d="M850 300 V362" marker-end="url(#ar)"/><rect x="56" y="232" width="196" height="68" rx="6" class="box"/><text x="154" y="253" text-anchor="middle" font-size="16" font-weight="600">Scope</text><text class="m" x="154" y="272" text-anchor="middle" font-size="12">issue scope and split</text><text class="m" x="154" y="288" text-anchor="middle" font-size="12">presets: gate, brainstorm</text><rect x="288" y="232" width="196" height="68" rx="6" class="box"/><text x="386" y="253" text-anchor="middle" font-size="16" font-weight="600">Assure</text><text class="m" x="386" y="272" text-anchor="middle" font-size="12">QA analysis</text><text class="m" x="386" y="288" text-anchor="middle" font-size="12">tester walkthrough</text><rect x="520" y="232" width="196" height="68" rx="6" class="box"/><text x="618" y="253" text-anchor="middle" font-size="16" font-weight="600">PR</text><text class="m" x="618" y="272" text-anchor="middle" font-size="12">feature docs, PR text</text><text class="m" x="618" y="288" text-anchor="middle" font-size="12">review feedback</text><rect x="752" y="232" width="196" height="68" rx="6" class="box"/><text x="850" y="253" text-anchor="middle" font-size="16" font-weight="600">User Manual</text><text class="m" x="850" y="272" text-anchor="middle" font-size="12">application manual</text><text class="m" x="850" y="288" text-anchor="middle" font-size="12">includes 5 skills</text></g><g class="s s4"><path class="c" d="M154 232 V174" marker-end="url(#ar)"/><rect x="56" y="104" width="196" height="68" rx="6" class="box"/><text x="154" y="125" text-anchor="middle" font-size="16" font-weight="600">Workflow</text><text class="m" x="154" y="144" text-anchor="middle" font-size="12">issue to verified PR</text><text class="m" x="154" y="160" text-anchor="middle" font-size="12">preset: workflow</text></g><g class="s s5"><path class="c opt" d="M520 266 H486" marker-end="url(#ar)"/><path class="c opt" d="M716 266 H750" marker-end="url(#ar)"/></g><g class="s s6"><rect x="520" y="104" width="196" height="68" rx="6" class="box"/><text x="618" y="125" text-anchor="middle" font-size="16" font-weight="600">Project</text><text class="m" x="618" y="144" text-anchor="middle" font-size="12">GitHub Project sync</text><text class="m" x="618" y="160" text-anchor="middle" font-size="12">no extension needed</text><rect x="752" y="104" width="196" height="68" rx="6" class="box"/><text x="850" y="125" text-anchor="middle" font-size="16" font-weight="600">Memory</text><text class="m" x="850" y="144" text-anchor="middle" font-size="12">memory and spec archive</text><text class="m" x="850" y="160" text-anchor="middle" font-size="12">no extension needed</text></g><g class="s s7"><rect x="24" y="516" width="712" height="140" rx="8" class="zone"/><text class="e" x="48" y="542" font-size="12">SANDUQ-SKILLS REPOSITORY · PORTABLE SKILLS, NO SPEC KIT</text><rect x="56" y="552" width="196" height="80" rx="6" class="box"/><text x="154" y="579" text-anchor="middle" font-size="16" font-weight="600">Illustrate</text><text class="m" x="154" y="598" text-anchor="middle" font-size="12">illustration-tools</text><text class="m" x="154" y="614" text-anchor="middle" font-size="12">copy in Illustrate</text><rect x="288" y="552" width="196" height="80" rx="6" class="box"/><text x="386" y="579" text-anchor="middle" font-size="16" font-weight="600">User Manual, 5 skills</text><text class="m" x="386" y="598" text-anchor="middle" font-size="12">dev-tools</text><text class="m" x="386" y="614" text-anchor="middle" font-size="12">copy in User Manual</text><rect x="520" y="552" width="196" height="80" rx="6" class="box"/><text x="618" y="579" text-anchor="middle" font-size="16" font-weight="600">Delegate Task</text><text class="m" x="618" y="598" text-anchor="middle" font-size="12">agent-tools</text><text class="m" x="618" y="614" text-anchor="middle" font-size="12">copy in Workflow</text></g><g class="s s8"><path class="lk" d="M386 516 V454" marker-end="url(#arl)"/><rect class="mask" x="394" y="476" width="232" height="18"/><text class="m" x="400" y="489" font-size="12">COPIED AT A PINNED RELEASE</text><path class="lk" d="M736 586 H778" marker-end="url(#arl)"/><rect x="780" y="546" width="168" height="80" rx="6" class="box"/><text x="864" y="573" text-anchor="middle" font-size="16" font-weight="600">sanduq</text><text class="m" x="864" y="592" text-anchor="middle" font-size="12">plugin marketplace</text><text class="m" x="864" y="608" text-anchor="middle" font-size="12">for Claude hosts</text></g><g class="s s8"><line x1="24" y1="692" x2="976" y2="692" class="zone"/><path class="c" d="M48 720 H88" marker-end="url(#ar)"/><text class="m" x="98" y="724" font-size="12">requires</text><path class="c opt" d="M200 720 H240" marker-end="url(#ar)"/><text class="m" x="250" y="724" font-size="12">uses when installed</text><path class="lk" d="M432 720 H472" marker-end="url(#arl)"/><text class="m" x="482" y="724" font-size="12">copied into, or listed by</text><rect x="700" y="712" width="28" height="16" rx="3" class="focal"/><text class="m" x="738" y="724" font-size="12">shared by four extensions</text></g></svg>
