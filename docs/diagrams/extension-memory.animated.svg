<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 888" role="img" aria-labelledby="title desc"><title id="title">Memory archive lifecycle</title><desc id="desc">Prepare queues completed implementation. A local session after merge checks the approved automatic policy and evidence. Eligibility, fixture migration and independent review precede recoverable checkpoint and final deletion. Any failed guard blocks the archive and requires the recorded recovery recipe.</desc><defs><style data-illustrate-animation="true">.ia-draw,.ia-flow{opacity:0;fill:none}.ia-flow{stroke-dasharray:3 14;stroke-linecap:round}.ia-dot,.ia-chev{display:none}@keyframes ia-draw-fwd{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-rev{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:-1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-both{0%{opacity:1;stroke-dasharray:0 1;stroke-dashoffset:-.5}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-hidden{0%,100%{opacity:0}}@keyframes ia-show{from{opacity:0}to{opacity:.9}}@keyframes ia-march{to{stroke-dashoffset:-17}}@keyframes ia-march-px{to{stroke-dashoffset:-17}}@keyframes ia-travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion: no-preference){.ia-draw.ia-a0{animation:ia-draw-fwd 600ms ease-out 0ms backwards}[data-ia="0"]{animation:ia-hidden 600ms}.ia-draw.ia-a1{animation:ia-draw-fwd 600ms ease-out 450ms backwards}[data-ia="1"]{animation:ia-hidden 1050ms}.ia-draw.ia-a2{animation:ia-draw-fwd 600ms ease-out 900ms backwards}[data-ia="2"]{animation:ia-hidden 1500ms}.ia-draw.ia-a3{animation:ia-draw-fwd 600ms ease-out 1350ms backwards}[data-ia="3"]{animation:ia-hidden 1950ms}.ia-draw.ia-a4{animation:ia-draw-fwd 600ms ease-out 1800ms backwards}[data-ia="4"]{animation:ia-hidden 2400ms}.ia-draw.ia-a5{animation:ia-draw-fwd 600ms ease-out 2250ms backwards}[data-ia="5"]{animation:ia-hidden 2850ms}.ia-draw.ia-a6{animation:ia-draw-fwd 600ms ease-out 2700ms backwards}[data-ia="6"]{animation:ia-hidden 3300ms}.ia-dot{display:inline;offset-rotate:0deg;animation:ia-travel 2400ms ease-in-out infinite}.ia-chev{display:inline;offset-rotate:auto;animation:ia-travel 2400ms linear infinite}.ia-rev{animation-direction:reverse}.ia-chev.ia-rev{offset-rotate:auto 180deg}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="888" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER / GIT</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">HOOK / ARCHIVER</text><line x1="320" y1="50" x2="320" y2="868" stroke="#c7d2e2"/><path data-ia="0" d="M170 134 V136 Q170 142 176 142 H464 Q470 142 470 148 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 134 V136 Q170 142 176 142 H464 Q470 142 470 148 V164" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a0" pathLength="1" aria-hidden="true"/><path data-ia="1" d="M470 230 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 230 V260" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a1" pathLength="1" aria-hidden="true"/><path data-ia="2" d="M470 326 V328 Q470 334 464 334 H176 Q170 334 170 340 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 326 V328 Q470 334 464 334 H176 Q170 334 170 340 V356" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a2" pathLength="1" aria-hidden="true"/><path data-ia="3" d="M170 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a3" pathLength="1" aria-hidden="true"/><path data-ia="4" d="M170 518 V520 Q170 526 176 526 H464 Q470 526 470 532 V548" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 518 V520 Q170 526 176 526 H464 Q470 526 470 532 V548" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a4" pathLength="1" aria-hidden="true"/><path data-ia="5" d="M470 614 V644" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 614 V644" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a5" pathLength="1" aria-hidden="true"/><path data-ia="6" d="M470 710 V740" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 710 V740" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a6" pathLength="1" aria-hidden="true"/><rect x="50" y="72" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">memory.init</text><text class="sub" x="170" y="118" text-anchor="middle">enable: automatic mode only</text><rect x="350" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="193" font-size="15" font-weight="600" text-anchor="middle">memory.impact</text><text class="sub" x="470" y="214" text-anchor="middle">before Analyze · required hook</text><rect x="350" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="289" font-size="15" font-weight="600" text-anchor="middle">memory.prepare</text><text class="sub" x="470" y="310" text-anchor="middle">after implementation · queue</text><rect x="50" y="360" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="385" font-size="15" font-weight="600" text-anchor="middle">Merge into configured branch</text><text class="sub" x="170" y="406" text-anchor="middle">main in this example</text><rect x="50" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="481" font-size="15" font-weight="600" text-anchor="middle">Next session / memory.run</text><text class="sub" x="170" y="502" text-anchor="middle">policy auto / explicit selection</text><rect x="350" y="552" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="470" y="577" font-size="15" font-weight="600" text-anchor="middle">Eligibility and evidence</text><text class="sub" x="470" y="598" text-anchor="middle">session policy / manual run</text><rect x="350" y="648" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="673" font-size="15" font-weight="600" text-anchor="middle">Knowledge + fixture migration</text><text class="sub" x="470" y="694" text-anchor="middle">independent review required</text><rect x="350" y="744" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="769" font-size="15" font-weight="600" text-anchor="middle">Checkpoint → final archive</text><text class="sub" x="470" y="790" text-anchor="middle">recoverable reviewed commits</text></svg>
