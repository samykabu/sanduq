<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc"><title id="title">Project synchronization</title><desc id="desc">Project Init discovers the actual board and maps phases. In standalone integrated mode configured phase hooks synchronize the board; optional/manual mode asks or requires a manual sync. Managed Workflow owns task creation and calls its adapter.</desc><defs><style data-illustrate-export-fonts="true">@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="600" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">HOOK / DISPATCHER</text><line x1="320" y1="50" x2="320" y2="580" stroke="#c7d2e2"/><path d="M170 134 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 230 V232 Q170 238 176 238 H464 Q470 238 470 244 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 326 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="50" y="72" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">project.init</text><text class="sub" x="170" y="118" text-anchor="middle">discover + approve mapping</text><rect x="50" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="193" font-size="15" font-weight="600" text-anchor="middle">Select sync policy</text><text class="sub" x="170" y="214" text-anchor="middle">required / optional / manual</text><rect x="350" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="289" font-size="15" font-weight="600" text-anchor="middle">Spec Kit phase completes</text><text class="sub" x="470" y="310" text-anchor="middle">standalone configured hook</text><rect x="350" y="360" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="470" y="385" font-size="15" font-weight="600" text-anchor="middle">project.sync</text><text class="sub" x="470" y="406" text-anchor="middle">reconcile actual columns</text><rect x="350" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="481" font-size="15" font-weight="600" text-anchor="middle">Record sync result</text><text class="sub" x="470" y="502" text-anchor="middle">skip is not completion</text></svg>
