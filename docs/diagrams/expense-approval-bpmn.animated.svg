        </g>


        <g data-bpmn="exclusiveGateway" data-bpmn-id="decision" data-bpmn-name="Approved?" data-lane="lane-manager">
          <polygon points="624,240 648,264 624,288 600,264" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
          <path data-bpmn-marker="exclusive" d="M617 257 L631 271 M631 257 L617 271" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linecap="round"/>
          <text x="658" y="268" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">Approved?</text>
        </g>


        <g data-bpmn="endEvent" data-bpmn-id="end-rejected" data-bpmn-name="Request denied" data-lane="lane-employee">
