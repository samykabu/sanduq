          <text x="649" y="124" fill="#4f5d75" font-size="13" font-family="'Geist', sans-serif">Request denied</text>
        </g>


        <g data-bpmn="task" data-bpmn-id="pay" data-bpmn-name="Process Payment" data-lane="lane-finance">
          <rect x="688" y="372" width="128" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
          <text x="752" y="405" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="752" y="405">Process</tspan><tspan x="752" y="422">Payment</tspan></text>
        </g>


