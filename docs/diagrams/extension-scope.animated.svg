<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 792" role="img" aria-labelledby="title desc"><title id="title">Scope and clarification</title><desc id="desc">Standalone Scope Run checks evidence and prerequisites. Approval or eligible configured policy precedes publication. Required Spec Kit hooks guard Specify, bind its issue, run clarification, and guard Plan. In managed mode the dispatcher owns this ordering.</desc><defs><style data-illustrate-animation="true">.ia-draw,.ia-flow{opacity:0;fill:none}.ia-flow{stroke-dasharray:3 14;stroke-linecap:round}.ia-dot,.ia-chev{display:none}@keyframes ia-draw-fwd{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-rev{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:-1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-both{0%{opacity:1;stroke-dasharray:0 1;stroke-dashoffset:-.5}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-hidden{0%,100%{opacity:0}}@keyframes ia-show{from{opacity:0}to{opacity:.9}}@keyframes ia-march{to{stroke-dashoffset:-17}}@keyframes ia-march-px{to{stroke-dashoffset:-17}}@keyframes ia-travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion: no-preference){.ia-draw.ia-a0{animation:ia-draw-fwd 600ms ease-out 0ms backwards}[data-ia="0"]{animation:ia-hidden 600ms}.ia-draw.ia-a1{animation:ia-draw-fwd 600ms ease-out 450ms backwards}[data-ia="1"]{animation:ia-hidden 1050ms}.ia-draw.ia-a2{animation:ia-draw-fwd 600ms ease-out 900ms backwards}[data-ia="2"]{animation:ia-hidden 1500ms}.ia-draw.ia-a3{animation:ia-draw-fwd 600ms ease-out 1350ms backwards}[data-ia="3"]{animation:ia-hidden 1950ms}.ia-draw.ia-a4{animation:ia-draw-fwd 600ms ease-out 1800ms backwards}[data-ia="4"]{animation:ia-hidden 2400ms}.ia-draw.ia-a5{animation:ia-draw-fwd 600ms ease-out 2250ms backwards}[data-ia="5"]{animation:ia-hidden 2850ms}.ia-dot{display:inline;offset-rotate:0deg;animation:ia-travel 2400ms ease-in-out infinite}.ia-chev{display:inline;offset-rotate:auto;animation:ia-travel 2400ms linear infinite}.ia-rev{animation-direction:reverse}.ia-chev.ia-rev{offset-rotate:auto 180deg}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#4f6078"/></marker></defs><style>text{font-family:&#x27;IBM Plex Sans&#x27;, &#x27;Noto Sans Arabic&#x27;, system-ui, sans-serif;fill:#15233c}.sub{font-family:&#x27;IBM Plex Mono&#x27;, &#x27;Noto Sans Arabic&#x27;, ui-monospace, monospace;fill:#4f6078;font-size:12px}</style><rect width="640" height="792" fill="#f6f8fc"/><text x="170" y="32" text-anchor="middle" font-size="13" font-weight="600">USER</text><text x="470" y="32" text-anchor="middle" font-size="13" font-weight="600">HOOK / AGENT</text><line x1="320" y1="50" x2="320" y2="772" stroke="#c7d2e2"/><path data-ia="0" d="M170 134 V164" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 134 V164" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a0" pathLength="1" aria-hidden="true"/><path data-ia="1" d="M170 230 V232 Q170 238 176 238 H464 Q470 238 470 244 V260" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 230 V232 Q170 238 176 238 H464 Q470 238 470 244 V260" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a1" pathLength="1" aria-hidden="true"/><path data-ia="2" d="M470 326 V356" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 326 V356" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a2" pathLength="1" aria-hidden="true"/><path data-ia="3" d="M470 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 422 V452" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a3" pathLength="1" aria-hidden="true"/><path data-ia="4" d="M470 518 V520 Q470 526 464 526 H176 Q170 526 170 532 V548" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 518 V520 Q470 526 464 526 H176 Q170 526 170 532 V548" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a4" pathLength="1" aria-hidden="true"/><path data-ia="5" d="M170 614 V616 Q170 622 176 622 H464 Q470 622 470 628 V644" fill="none" stroke="#4f6078" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 614 V616 Q170 622 176 622 H464 Q470 622 470 628 V644" fill="none" stroke="#4f6078" stroke-width="1.5" class="ia-draw ia-a5" pathLength="1" aria-hidden="true"/><rect x="50" y="72" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="97" font-size="15" font-weight="600" text-anchor="middle">scope.run 412</text><text class="sub" x="170" y="118" text-anchor="middle">manual · issue evidence</text><rect x="50" y="168" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="170" y="193" font-size="15" font-weight="600" text-anchor="middle">Approve scope decision</text><text class="sub" x="170" y="214" text-anchor="middle">or eligible project policy</text><rect x="350" y="264" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="289" font-size="15" font-weight="600" text-anchor="middle">scope.guard</text><text class="sub" x="470" y="310" text-anchor="middle">before Specify · required</text><rect x="350" y="360" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="385" font-size="15" font-weight="600" text-anchor="middle">scope.bind</text><text class="sub" x="470" y="406" text-anchor="middle">after Specify · explicit ID</text><rect x="350" y="456" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="481" font-size="15" font-weight="600" text-anchor="middle">scope.after-specify</text><text class="sub" x="470" y="502" text-anchor="middle">Brainstorm / core Clarify</text><rect x="50" y="552" width="240" height="62" rx="6" fill="rgba(37,99,235,0.09)" stroke="#2563eb"/><text x="170" y="577" font-size="15" font-weight="600" text-anchor="middle">Answer GitHub questions</text><text class="sub" x="170" y="598" text-anchor="middle">then workflow.clarify</text><rect x="350" y="648" width="240" height="62" rx="6" fill="#ffffff" stroke="#c7d2e2"/><text x="470" y="673" font-size="15" font-weight="600" text-anchor="middle">scope.plan-guard</text><text class="sub" x="470" y="694" text-anchor="middle">before Plan · unresolved stops</text></svg>
