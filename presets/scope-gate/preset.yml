schema_version: "1.0"
preset:
  id: scope-gate
  name: Scope before Specify
  version: "1.4.0"
  description: "Require a scoped GitHub issue before the upstream Specify workflow."
  author: "Samy K. Abushanab"
  repository: "https://github.com/samykabu/sanduq"
  license: MIT
requires:
  speckit_version: ">=1.0.0"
provides:
  templates:
    - type: command
      name: speckit.specify
      file: commands/specify-gate.md
      replaces: speckit.specify
      strategy: prepend
    - type: command
      name: speckit.clarify
      file: commands/clarify-github.md
      replaces: speckit.clarify
      strategy: prepend
tags:
  - scope
  - github
